<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReelHub - Google Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f5f5f5;
}

.box{
  width:90%;
  max-width:380px;
  background:white;
  padding:30px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 10px 35px rgba(0,0,0,.1);
}

.logo{
  font-size:32px;
  font-weight:800;
  margin-bottom:10px;
  color:#7c3aed;
}

.subtitle{
  color:#777;
  margin-bottom:25px;
}

.google-btn{
  width:100%;
  height:52px;
  border:1px solid #ddd;
  border-radius:12px;
  background:white;
  cursor:pointer;
  font-size:16px;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}

.google-btn:hover{
  background:#f7f7f7;
}

.google-icon{
  width:22px;
  height:22px;
}

#profile{
  display:none;
}

.profile-img{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  margin-bottom:12px;
}

#name{
  font-size:22px;
  font-weight:700;
}

#email{
  color:#777;
  margin:6px 0 20px;
}

.logout{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#ef4444;
  color:white;
  font-weight:700;
  cursor:pointer;
}

#status{
  margin-top:15px;
  font-size:13px;
  color:#777;
}
</style>
</head>

<body>

<div class="box">

  <!-- LOGIN -->
  <div id="login">

    <div class="logo">🎬 ReelHub</div>

    <div class="subtitle">
      Continue with Google
    </div>

    <button id="googleBtn" class="google-btn">

      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4"
        d="M21.35 12.23c0-.79-.07-1.55-.22-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z"/>

        <path fill="#34A853"
        d="M12 21.6c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.74 9.74 0 0 0 12 21.6z"/>

        <path fill="#FBBC05"
        d="M6.54 13.69A5.85 5.85 0 0 1 6.23 12c0-.59.1-1.16.31-1.69V7.78H3.3A9.73 9.73 0 0 0 2.27 12c0 1.57.38 3.06 1.03 4.22l3.24-2.53z"/>

        <path fill="#EA4335"
        d="M12 6.28c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.34 14.63 2.4 12 2.4a9.74 9.74 0 0 0-8.7 5.38l3.24 2.53C7.31 8 9.46 6.28 12 6.28z"/>
      </svg>

      Continue with Google

    </button>

    <div id="status"></div>

  </div>


  <!-- PROFILE AFTER LOGIN -->
  <div id="profile">

    <img id="photo" class="profile-img">

    <div id="name"></div>

    <div id="email"></div>

    <button id="logout" class="logout">
      Logout
    </button>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


/* Firebase */

const firebaseConfig = {
  apiKey: "AIzaSyCAiAXZjIFcbmueefZpx1SXc-_ELa57-rE",
  authDomain: "reelhu.firebaseapp.com",
  projectId: "reelhu",
  storageBucket: "reelhu.firebasestorage.app",
  messagingSenderId: "883255506643",
  appId: "1:883255506643:web:600256ed9bb47a4f828626",
  measurementId: "G-FY9N5XNF6Z"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

provider.setCustomParameters({
  prompt: "select_account"
});


/* Google Login */

document.getElementById("googleBtn").onclick =
async function(){

  try{

    document.getElementById("status").textContent =
      "Opening Google...";

    await signInWithRedirect(
      auth,
      provider
    );

  }catch(error){

    console.error(error);

    document.getElementById("status").textContent =
      error.message;

  }

};


/* Check redirect */

getRedirectResult(auth)
.then(result => {

  if(result && result.user){
    console.log("Google login successful");
  }

})
.catch(error => {

  console.error(error);

  document.getElementById("status").textContent =
    error.message;

});


/* Login state */

onAuthStateChanged(auth, user => {

  if(user){

    document.getElementById("login").style.display =
      "none";

    document.getElementById("profile").style.display =
      "block";

    document.getElementById("photo").src =
      user.photoURL || "";

    document.getElementById("name").textContent =
      user.displayName || "Google User";

    document.getElementById("email").textContent =
      user.email || "";

  }else{

    document.getElementById("login").style.display =
      "block";

    document.getElementById("profile").style.display =
      "none";

  }

});


/* Logout */

document.getElementById("logout").onclick =
async function(){

  await signOut(auth);

};

</script>

</body>
</html>
