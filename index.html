<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ReelHub</title>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 font-family:Arial,Helvetica,sans-serif;
}

body{
 background:#fafafa;
 color:#111;
 padding-bottom:70px;
}

button{
 border:0;
 cursor:pointer;
}

.hidden{
 display:none!important;
}

.topbar{
 height:60px;
 background:#fff;
 border-bottom:1px solid #ddd;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 15px;
 position:sticky;
 top:0;
 z-index:100;
}

.logo{
 font-size:25px;
 font-weight:bold;
}

.top-actions{
 display:flex;
 gap:8px;
}

.icon-btn{
 background:#f2f2f2;
 border-radius:50%;
 width:40px;
 height:40px;
 font-size:18px;
}

.page{
 max-width:650px;
 margin:auto;
}

.bottom-nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:62px;
 background:#fff;
 border-top:1px solid #ddd;
 display:flex;
 justify-content:space-around;
 align-items:center;
 z-index:200;
}

.nav-btn{
 background:none;
 font-size:12px;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:3px;
 color:#222;
}

.nav-btn span{
 font-size:22px;
}

.feed{
 padding:10px 0 80px;
}

.video-card{
 background:#fff;
 margin-bottom:15px;
 border-bottom:1px solid #ddd;
}

.profile-head{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px 12px;
}

.avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
}

.user-info{
 flex:1;
 min-width:0;
}

.username{
 font-weight:bold;
 font-size:14px;
}

.caption{
 color:#555;
 font-size:13px;
 margin-top:2px;
}

.post-follow-btn{
 background:#0095f6;
 color:#fff;
 padding:7px 12px;
 border-radius:8px;
 font-weight:bold;
 font-size:12px;
 margin-left:auto;
 white-space:nowrap;
}

.post-follow-btn.following{
 background:#eee;
 color:#111;
}

.video-wrap{
 width:100%;
 background:#000;
 position:relative;
}

.video-wrap video{
 width:100%;
 max-height:650px;
 display:block;
 background:#000;
}

.actions{
 display:flex;
 align-items:center;
 gap:6px;
 padding:8px 10px;
}

.action-btn{
 background:none;
 font-size:22px;
 padding:4px;
}

.action-btn span{
 font-size:12px;
 margin-left:2px;
}

.likes-count{
 padding:0 12px 6px;
 font-weight:bold;
 font-size:13px;
}

.post-caption{
 padding:0 12px 10px;
 font-size:14px;
}

.comment-box{
 display:flex;
 gap:6px;
 padding:8px 10px;
 border-top:1px solid #eee;
}

.comment-box input{
 flex:1;
 padding:9px 11px;
 border:1px solid #ddd;
 border-radius:20px;
 outline:none;
}

.primary{
 background:#0095f6;
 color:#fff;
 padding:9px 14px;
 border-radius:8px;
 font-weight:bold;
}

.secondary{
 background:#eee;
 color:#111;
 padding:9px 14px;
 border-radius:8px;
}

.follow-main{
 background:#0095f6;
 color:white;
 padding:10px 20px;
 border-radius:8px;
 font-weight:bold;
}

.follow-main.following{
 background:#eee;
 color:#111;
}

.profile-page{
 padding:20px 15px 90px;
}

.profile-top{
 display:flex;
 align-items:center;
 gap:20px;
}

.profile-avatar{
 width:90px;
 height:90px;
 border-radius:50%;
 object-fit:cover;
 background:#ddd;
}

.profile-data{
 flex:1;
}

.profile-username{
 font-size:20px;
 font-weight:bold;
 margin-bottom:12px;
}

.profile-stats{
 display:flex;
 gap:20px;
}

.stat{
 text-align:center;
}

.stat b{
 display:block;
 font-size:17px;
}

.stat small{
 color:#666;
}

.profile-bio{
 margin-top:15px;
}

.profile-actions{
 display:flex;
 gap:8px;
 margin-top:15px;
}

.profile-actions button{
 flex:1;
}

.profile-grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:3px;
 margin-top:20px;
}

.grid-item{
 aspect-ratio:1;
 background:#ddd;
 overflow:hidden;
 cursor:pointer;
}

.grid-item video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.55);
 z-index:500;
 align-items:center;
 justify-content:center;
 padding:15px;
}

.modal.show{
 display:flex;
}

.modal-box{
 background:#fff;
 width:100%;
 max-width:500px;
 max-height:90vh;
 border-radius:14px;
 overflow:hidden;
 display:flex;
 flex-direction:column;
}

.modal-head{
 padding:14px;
 border-bottom:1px solid #ddd;
 display:flex;
 justify-content:space-between;
 align-items:center;
 font-weight:bold;
}

.close-btn{
 background:#eee;
 width:32px;
 height:32px;
 border-radius:50%;
}

.modal-body{
 padding:15px;
 overflow:auto;
}

.form-group{
 margin-bottom:12px;
}

.form-group label{
 display:block;
 font-size:13px;
 margin-bottom:5px;
}

.form-group input,
.form-group textarea{
 width:100%;
 padding:11px;
 border:1px solid #ccc;
 border-radius:8px;
 outline:none;
}

.form-group textarea{
 min-height:100px;
 resize:vertical;
}

.search-box{
 padding:10px;
}

.search-box input{
 width:100%;
 padding:12px 15px;
 border:1px solid #ddd;
 border-radius:22px;
 outline:none;
}

.search-result{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px;
 border-bottom:1px solid #eee;
 cursor:pointer;
}

.search-result img{
 width:45px;
 height:45px;
 border-radius:50%;
 object-fit:cover;
}

.message-user{
 display:flex;
 align-items:center;
 gap:10px;
 padding:12px;
 border-bottom:1px solid #eee;
 cursor:pointer;
}

.message-user img{
 width:45px;
 height:45px;
 border-radius:50%;
 object-fit:cover;
}

.message-info{
 flex:1;
}

.message-name{
 font-weight:bold;
}

.message-last{
 color:#777;
 font-size:12px;
 margin-top:3px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

#chatArea{
 display:none;
 height:70vh;
 flex-direction:column;
}

.chat-header{
 padding:12px;
 border-bottom:1px solid #ddd;
 display:flex;
 align-items:center;
 gap:10px;
}

.chat-messages{
 flex:1;
 overflow:auto;
 padding:12px;
 background:#f5f5f5;
}

.msg{
 max-width:75%;
 padding:9px 12px;
 border-radius:15px;
 margin-bottom:8px;
 word-break:break-word;
}

.msg.me{
 margin-left:auto;
 background:#0095f6;
 color:#fff;
 border-bottom-right-radius:4px;
}

.msg.other{
 background:#fff;
 border-bottom-left-radius:4px;
}

.chat-input{
 display:flex;
 gap:6px;
 padding:8px;
 border-top:1px solid #ddd;
 background:#fff;
}

.chat-input input{
 flex:1;
 border:1px solid #ddd;
 border-radius:20px;
 padding:10px 14px;
 outline:none;
}

.toast{
 position:fixed;
 bottom:80px;
 left:50%;
 transform:translateX(-50%);
 background:#111;
 color:#fff;
 padding:10px 16px;
 border-radius:20px;
 z-index:1000;
 display:none;
 font-size:13px;
}

.toast.show{
 display:block;
}

.empty{
 text-align:center;
 padding:40px 15px;
 color:#777;
}

.loading{
 text-align:center;
 padding:30px;
 color:#777;
}

.story-row{
 display:flex;
 gap:12px;
 overflow:auto;
 padding:10px;
 background:#fff;
 border-bottom:1px solid #ddd;
}

.story{
 min-width:65px;
 text-align:center;
 font-size:11px;
}

.story img{
 width:58px;
 height:58px;
 border-radius:50%;
 object-fit:cover;
 border:2px solid #0095f6;
}

.upload-preview{
 width:100%;
 max-height:300px;
 object-fit:contain;
 background:#111;
 border-radius:8px;
 display:none;
 margin-bottom:10px;
}

.dark{
 background:#111;
 color:#eee;
}

.dark .topbar,
.dark .bottom-nav,
.dark .video-card,
.dark .modal-box,
.dark .chat-input{
 background:#181818;
 color:#eee;
}

.dark .icon-btn,
.dark .secondary,
.dark .follow-main.following{
 background:#333;
 color:#fff;
}

.dark .caption,
.dark .stat small,
.dark .message-last{
 color:#aaa;
}

.dark .comment-box,
.dark .chat-header,
.dark .modal-head,
.dark .message-user{
 border-color:#333;
}

.dark .chat-messages{
 background:#111;
}

.dark .chat-messages .msg.other{
 background:#222;
 color:#fff;
}

.dark input,
.dark textarea{
 background:#222;
 color:#fff;
 border-color:#444;
}

.dark .post-follow-btn.following{
 background:#333;
 color:#fff;
}
</style>
</head>

<body>

<header class="topbar">
  <div class="logo">ReelHub</div>

  <div class="top-actions">
    <button class="icon-btn" onclick="openSearch()">🔍</button>
    <button class="icon-btn" onclick="openMessages()">💬</button>
    <button class="icon-btn" onclick="toggleDark()">🌙</button>
  </div>
</header>

<main class="page">

  <section id="homePage">
    <div id="storyRow" class="story-row"></div>
    <div id="feed" class="feed">
      <div class="loading">Loading...</div>
    </div>
  </section>

  <section id="profilePage" class="profile-page hidden">

    <div class="profile-top">
      <img id="myAvatar" class="profile-avatar"
           src=""
           onerror="this.src='https://via.placeholder.com/100'">

      <div class="profile-data">
        <div id="myUsername" class="profile-username">User</div>

        <div class="profile-stats">
          <div class="stat">
            <b id="myPostCount">0</b>
            <small>Posts</small>
          </div>

          <div class="stat">
            <b id="myFollowers">0</b>
            <small>Followers</small>
          </div>

          <div class="stat">
            <b id="myFollowing">0</b>
            <small>Following</small>
          </div>
        </div>
      </div>
    </div>

    <div id="myBio" class="profile-bio"></div>

    <div class="profile-actions">
      <button class="secondary" onclick="openEditProfile()">
        Edit Profile
      </button>

      <button class="secondary" onclick="openUpload()">
        + Upload
      </button>
    </div>

    <div id="myGrid" class="profile-grid"></div>

  </section>

</main>

<nav class="bottom-nav">

  <button class="nav-btn" onclick="showHome()">
    <span>🏠</span>
    Home
  </button>

  <button class="nav-btn" onclick="openUpload()">
    <span>➕</span>
    Upload
  </button>

  <button class="nav-btn" onclick="showProfile()">
    <span>👤</span>
    Profile
  </button>

</nav>


<!-- SEARCH MODAL -->
<div id="searchModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">
      <span>Search</span>
      <button class="close-btn" onclick="closeModal('searchModal')">✕</button>
    </div>

    <div class="search-box">
      <input id="searchInput"
             placeholder="Username search करें..."
             oninput="searchUsers(this.value)">
    </div>

    <div id="searchResults" class="modal-body"></div>

  </div>

</div>


<!-- PUBLIC PROFILE MODAL -->
<div id="publicProfileModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">
      <span>Profile</span>
      <button class="close-btn"
              onclick="closeModal('publicProfileModal')">✕</button>
    </div>

    <div class="modal-body">

      <div class="profile-top">

        <img id="publicAvatar"
             class="profile-avatar"
             src="https://via.placeholder.com/100">

        <div class="profile-data">

          <div id="publicUsername"
               class="profile-username">
            User
          </div>

          <div class="profile-stats">

            <div class="stat">
              <b id="publicPostCount">0</b>
              <small>Posts</small>
            </div>

            <div class="stat">
              <b id="publicFollowers">0</b>
              <small>Followers</small>
            </div>

            <div class="stat">
              <b id="publicFollowing">0</b>
              <small>Following</small>
            </div>

          </div>

        </div>

      </div>

      <div id="publicBio"
           class="profile-bio"></div>

      <div class="profile-actions">

        <button id="publicFollowButton"
                class="follow-main">
          Follow
        </button>

        <button class="secondary"
                onclick="openChat(publicUid)">
          💬 Message
        </button>

      </div>

      <div id="publicGrid"
           class="profile-grid"></div>

    </div>

  </div>

</div>


<!-- UPLOAD MODAL -->
<div id="uploadModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">
      <span>Upload Video</span>
      <button class="close-btn"
              onclick="closeModal('uploadModal')">
        ✕
      </button>
    </div>

    <div class="modal-body">

      <div class="form-group">

        <label>Video</label>

        <input id="videoFile"
               type="file"
               accept="video/*"
               onchange="previewVideo(event)">

      </div>

      <video id="uploadPreview"
             class="upload-preview"
             controls></video>

      <div class="form-group">

        <label>Caption</label>

        <textarea id="videoCaption"
                  placeholder="Caption लिखें..."></textarea>

      </div>

      <button id="uploadButton"
              class="primary"
              onclick="uploadVideo()">
        Upload
      </button>

      <div id="uploadStatus"
           style="margin-top:10px;color:#777"></div>

    </div>

  </div>

</div>


<!-- EDIT PROFILE -->
<div id="editProfileModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <span>Edit Profile</span>

      <button class="close-btn"
              onclick="closeModal('editProfileModal')">
        ✕
      </button>

    </div>

    <div class="modal-body">

      <div class="form-group">
        <label>Username</label>
        <input id="editUsername">
      </div>

      <div class="form-group">
        <label>Bio</label>
        <textarea id="editBio"></textarea>
      </div>

      <div class="form-group">
        <label>Profile Photo</label>
        <input id="profileFile"
               type="file"
               accept="image/*">
      </div>

      <button class="primary"
              onclick="saveProfile()">
        Save Profile
      </button>

    </div>

  </div>

</div>


<!-- MESSAGE MODAL -->
<div id="messageModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <span>Messages</span>

      <button class="close-btn"
              onclick="closeMessages()">
        ✕
      </button>

    </div>

    <div id="messageInbox"
         class="modal-body">
    </div>

    <div id="chatArea">

      <div class="chat-header">

        <button class="close-btn"
                onclick="backToInbox()">
          ←
        </button>

        <img id="chatAvatar"
             class="avatar"
             src="https://via.placeholder.com/100">

        <div class="message-info">
          <div id="chatUsername"
               class="message-name">
            User
          </div>
        </div>

      </div>

      <div id="chatMessages"
           class="chat-messages">
      </div>

      <div class="chat-input">

        <input id="messageInput"
               placeholder="Message लिखें..."
               onkeydown="handleMessageKey(event)">

        <button class="primary"
                onclick="sendMessage()">
          Send
        </button>

      </div>

    </div>

  </div>

</div>


<div id="toast" class="toast"></div>


<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
 getAuth,
 GoogleAuthProvider,
 signInWithPopup,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
 getFirestore,
 collection,
 doc,
 getDoc,
 getDocs,
 setDoc,
 addDoc,
 deleteDoc,
 updateDoc,
 query,
 where,
 orderBy,
 onSnapshot,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* ================= FIREBASE ================= */

const firebaseConfig = {

 apiKey:"AIzaSyCAiAXZjIFcbmueefZpx1SXc-_ELa57-rE",

 authDomain:"reelhu.firebaseapp.com",

 projectId:"reelhu",

 storageBucket:"reelhu.firebasestorage.app",

 messagingSenderId:"883255506643",

 appId:"1:883255506643:web:600256ed9bb47a4f828626",

 measurementId:"G-FY9N5XNF6Z"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();


/* ================= CLOUDINARY ================= */

const CLOUDINARY_CLOUD_NAME = "s3eresx6";

const CLOUDINARY_UPLOAD_PRESET = "reelhub_upload";


/* ================= GLOBAL ================= */

let currentUser = null;

let allVideos = [];

let allProfiles = [];

let publicUid = null;

let activeChatUid = null;

let activeConversationId = null;

let messageUnsubscribe = null;

let inboxUnsubscribe = null;

let followBusy = false;


/* ================= HELPERS ================= */

window.showToast = function(message){

 const toast = document.getElementById("toast");

 toast.textContent = message;

 toast.classList.add("show");

 setTimeout(()=>{
   toast.classList.remove("show");
 },2500);

};


function escapeHTML(value=""){

 return String(value)

  .replaceAll("&","&amp;")

  .replaceAll("<","&lt;")

  .replaceAll(">","&gt;")

  .replaceAll('"',"&quot;")

  .replaceAll("'","&#039;");

}


function closeModal(id){

 document.getElementById(id)?.classList.remove("show");

}

window.closeModal = closeModal;


function formatDate(timestamp){

 if(!timestamp) return "";

 try{

   const date = timestamp.toDate
     ? timestamp.toDate()
     : new Date(timestamp);

   return date.toLocaleString("hi-IN",{
     day:"2-digit",
     month:"short",
     hour:"2-digit",
     minute:"2-digit"
   });

 }catch{
   return "";
 }

}


/* ================= AUTH ================= */

async function login(){

 try{

   await signInWithPopup(auth,provider);

 }catch(error){

   console.error(error);

   showToast("Login नहीं हुआ");

 }

}


onAuthStateChanged(auth,async user=>{

 currentUser = user;

 if(!user){

   document.getElementById("feed").innerHTML = `
     <div class="empty">
       <h3>ReelHub में आपका स्वागत है</h3>
       <p style="margin:10px 0">Videos देखने और upload करने के लिए login करें</p>
       <button class="primary" onclick="login()">Google Login</button>
     </div>
   `;

   return;

 }

 await ensureProfile();

 await loadMyProfile();

 await loadAllVideos();

});


window.login = login;


/* ================= PROFILE ================= */

async function ensureProfile(){

 if(!currentUser) return;

 const ref = doc(db,"profiles",currentUser.uid);

 const snap = await getDoc(ref);

 if(!snap.exists()){

   await setDoc(ref,{

     uid:currentUser.uid,

     username:
       currentUser.displayName ||
       "User"+currentUser.uid.slice(0,5),

     email:currentUser.email || "",

     photoURL:
       currentUser.photoURL || "",

     bio:"",

     createdAt:serverTimestamp(),

     followersCount:0,

     followingCount:0,

     videoCount:0

   });

 }

}


async function getProfile(uid){

 if(!uid) return null;

 const snap = await getDoc(doc(db,"profiles",uid));

 if(!snap.exists()) return null;

 return {
   uid,
   ...snap.data()
 };

}


/* ================= FOLLOW COUNTS ================= */

async function getFollowCounts(uid){

 if(!uid){

   return {
     followersCount:0,
     followingCount:0
   };

 }

 try{

   const followersSnap = await getDocs(

     query(
       collection(db,"follows"),
       where("followingId","==",uid)
     )

   );

   const followingSnap = await getDocs(

     query(
       collection(db,"follows"),
       where("followerId","==",uid)
     )

   );

   return {

     followersCount:followersSnap.size,

     followingCount:followingSnap.size

   };

 }catch(error){

   console.error("FOLLOW COUNT ERROR",error);

   return {
     followersCount:0,
     followingCount:0
   };

 }

}


/* ================= MY PROFILE ================= */

async function loadMyProfile(){

 if(!currentUser) return;

 const profile = await getProfile(currentUser.uid);

 if(!profile) return;

 const counts = await getFollowCounts(currentUser.uid);

 document.getElementById("myUsername").textContent =
   profile.username || "User";

 document.getElementById("myBio").textContent =
   profile.bio || "";

 document.getElementById("myAvatar").src =
   profile.photoURL ||
   "https://via.placeholder.com/100";

 document.getElementById("myFollowers").textContent =
   counts.followersCount;

 document.getElementById("myFollowing").textContent =
   counts.followingCount;

 document.getElementById("myPostCount").textContent =
   allVideos.filter(v=>v.uid===currentUser.uid).length ||
   profile.videoCount ||
   0;

}


window.showProfile = async function(){

 document.getElementById("homePage")
   .classList.add("hidden");

 document.getElementById("profilePage")
   .classList.remove("hidden");

 await loadMyProfile();

};


/* ================= HOME ================= */

window.showHome = function(){

 document.getElementById("profilePage")
   .classList.add("hidden");

 document.getElementById("homePage")
   .classList.remove("hidden");

};


/* ================= LOAD VIDEOS ================= */

async function loadAllVideos(){

 try{

   const snap = await getDocs(
     collection(db,"videos")
   );

   allVideos = snap.docs.map(d=>({
     id:d.id,
     ...d.data()
   }));

   allVideos.sort((a,b)=>{

     const aTime =
       a.createdAt?.toMillis?.() || 0;

     const bTime =
       b.createdAt?.toMillis?.() || 0;

     return bTime-aTime;

   });

   renderFeed();

   renderMyGrid();

 }catch(error){

   console.error(error);

   document.getElementById("feed").innerHTML = `

async function setupPostFollow(
 button,
 targetUid
){

 if(!button ||
    !currentUser ||
    !targetUid ||
    targetUid===currentUser.uid){

   return;

 }

 const followRef = doc(
   db,
   "follows",
   `${currentUser.uid}_${targetUid}`
 );


 async function refresh(){

   try{

     const snap =
       await getDoc(followRef);

     if(snap.exists()){

       button.textContent =
         "Following";

       button.classList.add(
         "following"
       );

     }else{

       button.textContent =
         "Follow";

       button.classList.remove(
         "following"
       );

     }

   }catch(error){

     console.error(error);

   }

 }


 await refresh();


 button.onclick = async event=>{

   event.stopPropagation();

   if(button.disabled) return;

   button.disabled=true;

   try{

     const snap =
       await getDoc(followRef);

       await deleteDoc(followRef);

       showToast("Unfollowed");

     }else{

       await setDoc(

         followRef,

         {
           followerId:currentUser.uid,

           followingId:targetUid,

           createdAt:serverTimestamp()

     await refresh();

       );

       "Follow नहीं हुआ: "+

/* ================= MESSAGE INBOX ================= */

async function loadMessageInbox(){

 const inbox =
   document.getElementById(
     "messageInbox"
   );

 inbox.innerHTML=`
   <div class="loading">
     Messages loading...
   </div>
 `;

 try{

   const q =
     query(

       collection(
         db,
         "conversations"
       ),

       where(
         "participants",
         "array-contains",
         currentUser.uid
       )

     );

   const snap =
     await getDocs(q);

   const conversations =
     snap.docs.map(d=>({

       id:d.id,

       ...d.data()

     }));

   conversations.sort((a,b)=>{

     const aTime =
       a.lastMessageAt?.toMillis?.() || 0;

     const bTime =
       b.lastMessageAt?.toMillis?.() || 0;

     return bTime-aTime;

   });

   if(!conversations.length){

     inbox.innerHTML=`
       <div class="empty">
         अभी कोई message नहीं है
       </div>
     `;

     return;

   }

   inbox.innerHTML="";

   for(const conversation of conversations){

     const otherUid =
       conversation.participants
         ?.find(uid=>
           uid!==currentUser.uid
         );

     if(!otherUid) continue;

     const profile =
       await getProfile(otherUid);

     if(!profile) continue;

     const item =
       document.createElement("div");

     item.className="message-user";

     item.innerHTML=`

       <img
         src="${escapeHTML(
           profile.photoURL ||
           "https://via.placeholder.com/100"
         )}"
       >

       <div class="message-info">

         <div class="message-name">
           ${escapeHTML(
             profile.username ||
             "User"
           )}
         </div>

         <div class="message-last">
           ${escapeHTML(
             conversation.lastMessage ||
             "Start chat"
           )}
         </div>

       </div>

     `;

     item.onclick=()=>{

       openChat(otherUid);

     };

     inbox.appendChild(item);

   }

 }catch(error){

   console.error(
     "INBOX ERROR:",
     error
   );

   inbox.innerHTML=`
     <div class="empty">
       <p>Messages load नहीं हुए</p>
       <small>
         Firebase Rules में conversations की permission check करें.
       </small>
     </div>
   `;

 }

}

   "https://via.placeholder.com/100";

 document.getElementById(
   "chatMessages"
 ).innerHTML=`
   <div class="empty">
     Chat शुरू करें
   </div>
 `;

 /*
   IMPORTANT:
   Chat open करने के लिए अब conversation
   document को पहले से write नहीं किया जा रहा।
   इससे permission error की वजह से chat
   open होना बंद नहीं होगा.
 */

 startMessageListener();

};


/* ================= MESSAGE LISTENER ================= */

function stopMessageListener(){

 if(messageUnsubscribe){

   messageUnsubscribe();

   messageUnsubscribe=null;

 }

}


function startMessageListener(){

 stopMessageListener();

 if(!activeConversationId) return;

 const messagesRef =
   collection(
     db,
     "conversations",
     activeConversationId,
     "messages"
   );

 try{

   messageUnsubscribe =
     onSnapshot(

       messagesRef,

       snapshot=>{

         const messages =
           snapshot.docs.map(d=>({

             id:d.id,

             ...d.data()

           }));

         messages.sort((a,b)=>{

           const aTime =
             a.createdAt?.toMillis?.() || 0;

           const bTime =
             b.createdAt?.toMillis?.() || 0;

           return aTime-bTime;

         });

         renderMessages(
           messages
         );

       },

       error=>{

         console.error(
           "MESSAGE LISTENER ERROR:",
           error
         );

         document.getElementById(
           "chatMessages"
         ).innerHTML=`

           <div class="empty">

             <p>Messages load नहीं हुए</p>

             <small>
               Firebase Rules में messages permission check करें.
             </small>

           </div>

         `;

       }

     );

 }catch(error){

   console.error(error);

 }

}


/* ================= RENDER MESSAGES ================= */

function renderMessages(messages){

 const box =
   document.getElementById(
     "chatMessages"
   );

 if(!messages.length){

   box.innerHTML=`
     <div class="empty">
       अभी कोई message नहीं है
     </div>
   `;

   return;

 }

 box.innerHTML="";

 messages.forEach(message=>{

   const div =
     document.createElement("div");

   div.className =
     "msg "+
     (
       message.senderId===
       currentUser.uid
       ?
       "me"
       :
       "other"
     );

   div.textContent =
     message.text || "";

   box.appendChild(div);

 });

 box.scrollTop =
   box.scrollHeight;

}


/* ================= SEND MESSAGE ================= */

window.sendMessage =
async function(){

 if(!currentUser ||
    !activeChatUid ||
    !activeConversationId){

   showToast(
     "Chat open करें"
   );

   return;

 }

 const input =
   document.getElementById(
     "messageInput"
   );

 const text =
   input.value.trim();

 if(!text) return;

 const sendButton =
   document.querySelector(
     "#chatArea .primary"
   );

 if(sendButton)
   sendButton.disabled=true;

 try{

   const conversationRef =
     doc(
       db,
       "conversations",
       activeConversationId
     );

   /*
     FIRST create conversation.
     इसलिए updateDoc की permission /
     missing-document problem नहीं आएगी.
   */

   await setDoc(

     conversationRef,

     {

       participants:[
         currentUser.uid,
         activeChatUid
       ],

       createdAt:serverTimestamp(),

       updatedAt:serverTimestamp(),

       lastMessage:text,

       lastMessageAt:serverTimestamp()

     },

     {
       merge:true
     }

   );


   const messagesRef =
     collection(
       db,
       "conversations",
       activeConversationId,
       "messages"
     );


   await addDoc(

     messagesRef,

     {

       senderId:
         currentUser.uid,

       receiverId:
         activeChatUid,

       text:text,

       createdAt:
         serverTimestamp()

     }

   );


   /*
     Last message update
     */

   await setDoc(

     conversationRef,

     {

       participants:[
         currentUser.uid,
         activeChatUid
       ],

       lastMessage:text,

       lastMessageAt:
         serverTimestamp(),

       updatedAt:
         serverTimestamp()

     },

     {
       merge:true
     }

   );


   input.value="";

 }catch(error){

   console.error(
     "SEND MESSAGE ERROR:",
     error
   );

   showToast(
     "Message send नहीं हुआ: "+
     (error.code || "error")
   );

 }finally{

   if(sendButton)
     sendButton.disabled=false;

 }

};


/* ================= ENTER SEND ================= */

window.handleMessageKey =
function(event){

 if(
   event.key==="Enter" &&
   !event.shiftKey
 ){

   event.preventDefault();

   sendMessage();

 }

};


/* ================= DARK MODE ================= */

window.toggleDark =
function(){

 document.body.classList.toggle(
   "dark"
 );

};


/* ================= START ================= */

window.addEventListener(
 "beforeunload",
 ()=>{

   stopMessageListener();

   if(inboxUnsubscribe)
     inboxUnsubscribe();

 }
);

</script>

FOLLOW RULE

match /follows/{followId} {

  allow read: if request.auth != null;

  allow create: if request.auth != null
    && request.resource.data.followerId == request.auth.uid
    && request.resource.data.followingId != request.auth.uid;

  allow delete: if request.auth != null
    && resource.data.followerId == request.auth.uid;
}

-----------------------------------------------------------
MESSAGE / CONVERSATION RULE
-----------------------------------------------------------

match /conversations/{conversationId} {

  allow read: if request.auth != null
    && request.auth.uid in resource.data.participants;

  allow create: if request.auth != null
    && request.auth.uid in request.resource.data.participants;

  allow update: if request.auth != null
    && request.auth.uid in resource.data.participants;

  match /messages/{messageId} {

    allow read: if request.auth != null
      && request.auth.uid in
      get(
        /databases/$(database)/documents/conversations/$(conversationId)
      ).data.participants;

    allow create: if request.auth != null
      && request.auth.uid == request.resource.data.senderId
      && request.auth.uid in
      get(
        /databases/$(database)/documents/conversations/$(conversationId)
      ).data.participants;
  }
}
