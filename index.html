<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReelHub - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #312e81, #7c3aed);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 410px;
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-icon {
      width: 65px;
      height: 65px;
      margin: auto;
      border-radius: 18px;
      background: linear-gradient(135deg,#7c3aed,#ec4899);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(124,58,237,.35);
    }

    .logo h1 {
      margin-top: 12px;
      font-size: 30px;
      color: #171717;
    }

    .logo p {
      margin-top: 5px;
      color: #777;
      font-size: 14px;
    }

    .field {
      margin-top: 15px;
    }

    .field label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
      background: #fafafa;
    }

    input:focus {
      border-color: #7c3aed;
      background: white;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .login-btn {
      background: linear-gradient(135deg,#7c3aed,#ec4899);
      color: white;
    }

    .signup-btn {
      background: #111827;
      color: white;
    }

    .google-btn {
      background: white;
      color: #222;
      border: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .google-icon {
      font-size: 20px;
      font-weight: bold;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0;
      color: #999;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #ddd;
      flex: 1;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    #home {
      display: none;
      text-align: center;
    }

    .profile {
      margin: 20px 0;
    }

    .profile img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #7c3aed;
    }

    .profile h2 {
      margin-top: 12px;
    }

    .profile p {
      color: #777;
      margin-top: 5px;
      word-break: break-word;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
    }

    .small {
      text-align: center;
      margin-top: 18px;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="box">

    <!-- LOGIN -->
    <div id="loginPage">

      <div class="logo">
        <div class="logo-icon">▶</div>
        <h1>ReelHub</h1>
        <p>Watch • Share • Connect</p>
      </div>

      <div class="field">
        <label>Email</label>
        <input
          type="email"
          id="email"
          placeholder="अपना email डालें"
        >
      </div>

      <div class="field">
        <label>Password</label>
        <input
          type="password"
          id="password"
          placeholder="अपना password डालें"
        >
      </div>

      <button class="login-btn" id="loginBtn">
        Login
      </button>

      <button class="signup-btn" id="signupBtn">
        Create New Account
      </button>

      <div class="divider">या</div>

      <button class="google-btn" id="googleBtn">
        <span class="google-icon">G</span>
        Continue with Google
      </button>

      <div id="message" class="message"></div>

      <div class="small">
        ReelHub में login करके आप हमारे app का उपयोग कर सकते हैं।
      </div>

    </div>


    <!-- HOME AFTER LOGIN -->
    <div id="home">

      <div class="logo">
        <div class="logo-icon">▶</div>
        <h1>ReelHub</h1>
        <p>Welcome to ReelHub 🎬</p>
      </div>

      <div class="profile">
        <img id="userPhoto"
             src="https://via.placeholder.com/80"
             alt="Profile">

        <h2 id="userName">User</h2>
        <p id="userEmail"></p>
      </div>

      <button class="logout-btn" id="logoutBtn">
        Logout
      </button>

      <div class="small">
        आपका ReelHub account successfully login हो गया है। ✅
      </div>

    </div>

  </div>


  <!-- Firebase -->
  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    // ==============================
    // REELHUB FIREBASE CONFIG
    // ==============================

    const firebaseConfig = {
      apiKey: "AIzaSyCAiAXZjIFcbmueefZpx1SXc-_ELa57-rE",
      authDomain: "reelhu.firebaseapp.com",
      projectId: "reelhu",
      storageBucket: "reelhu.firebasestorage.app",
      messagingSenderId: "883255506643",
      appId: "1:883255506643:web:600256ed9bb47a4f828626",
      measurementId: "G-FY9N5XNF6Z"
    };


    // Firebase start
    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const provider = new GoogleAuthProvider();


    // Elements
    const loginPage = document.getElementById("loginPage");
    const home = document.getElementById("home");

    const email = document.getElementById("email");
    const password = document.getElementById("password");

    const loginBtn = document.getElementById("loginBtn");
    const signupBtn = document.getElementById("signupBtn");
    const googleBtn = document.getElementById("googleBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const message = document.getElementById("message");

    const userName = document.getElementById("userName");
    const userEmail = document.getElementById("userEmail");
    const userPhoto = document.getElementById("userPhoto");


    // Message function
    function showMessage(text, type = "error") {

      message.textContent = text;

      message.className = "message " + type;

      message.style.display = "block";

      setTimeout(() => {
        message.style.display = "none";
      }, 4000);
    }


    // ==============================
    // EMAIL LOGIN
    // ==============================

    loginBtn.addEventListener("click", async () => {

      const e = email.value.trim();
      const p = password.value;

      if (!e || !p) {
        showMessage("Email और Password दोनों डालें।");
        return;
      }

      try {

        await signInWithEmailAndPassword(
          auth,
          e,
          p
        );

      } catch (error) {

        console.log(error);

        if (error.code === "auth/invalid-credential") {
          showMessage("Email या Password गलत है।");
        } else {
          showMessage("Login नहीं हो पाया।");
        }

      }

    });


    // ==============================
    // CREATE ACCOUNT
    // ==============================

    signupBtn.addEventListener("click", async () => {

      const e = email.value.trim();
      const p = password.value;

      if (!e || !p) {
        showMessage("पहले Email और Password डालें।");
        return;
      }

      if (p.length < 6) {
        showMessage("Password कम से कम 6 characters का होना चाहिए।");
        return;
      }

      try {

        await createUserWithEmailAndPassword(
          auth,
          e,
          p
        );

        showMessage(
          "Account successfully बन गया! 🎉",
          "success"
        );

      } catch (error) {

        console.log(error);

        if (error.code === "auth/email-already-in-use") {
          showMessage("यह Email पहले से registered है।");
        } else {
          showMessage("Account नहीं बन पाया।");
        }

      }

    });


    // ==============================
    // GOOGLE LOGIN
    // ==============================

    googleBtn.addEventListener("click", async () => {

      try {

        await signInWithPopup(
          auth,
          provider
        );

      } catch (error) {

        console.log(error);

        if (error.code === "auth/popup-closed-by-user") {
          showMessage("Google Login बंद कर दिया गया।");
        } else {
          showMessage("Google Login नहीं हो पाया।");
        }

      }

    });


    // ==============================
    // LOGOUT
    // ==============================

    logoutBtn.addEventListener("click", async () => {

      try {

        await signOut(auth);

      } catch (error) {

        console.log(error);

      }

    });


    // ==============================
    // AUTH STATE
    // ==============================

    onAuthStateChanged(auth, (user) => {

      if (user) {

        loginPage.style.display = "none";
        home.style.display = "block";

        userName.textContent =
          user.displayName || "ReelHub User";

        userEmail.textContent =
          user.email || "";

        if (user.photoURL) {
          userPhoto.src = user.photoURL;
        }

      } else {

        loginPage.style.display = "block";
        home.style.display = "none";

      }

    });

  </script>

</body>
  </html>
