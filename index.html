<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ReelHub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f3f4f6;
  color:#111827;
  padding-bottom:75px;
}

button{
  border:0;
  cursor:pointer;
}

.topbar{
  position:sticky;
  top:0;
  z-index:1000;
  height:60px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  border-bottom:1px solid #ddd;
}

.logo{
  font-size:23px;
  font-weight:800;
}

.header-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  background:#f1f5f9;
  padding:10px 12px;
  border-radius:12px;
  font-size:17px;
}

.panel{
  display:none;
  max-width:650px;
  margin:auto;
  padding:15px;
}

.panel.active{
  display:block;
}

.card{
  background:white;
  border-radius:16px;
  padding:15px;
  margin-bottom:14px;
  box-shadow:0 2px 12px rgba(0,0,0,.07);
}

.profile-head{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.user-info{
  flex:1;
}

.user-name{
  font-weight:bold;
  font-size:16px;
}

.username{
  color:#777;
  font-size:13px;
}

.follow-btn{
  background:#111827;
  color:white;
  padding:9px 14px;
  border-radius:10px;
  font-weight:bold;
}

.follow-btn.following{
  background:#e5e7eb;
  color:#111;
}

.video{
  width:100%;
  max-height:620px;
  border-radius:14px;
  margin-top:12px;
  background:#000;
}

.video-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.action-btn{
  background:#f1f5f9;
  padding:9px 12px;
  border-radius:10px;
  font-size:14px;
}

.action-btn.active{
  background:#111827;
  color:white;
}

.delete-btn{
  background:#fee2e2;
  color:#b91c1c;
}

.comment-box{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.comment-box input{
  flex:1;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
}

.primary{
  background:#111827;
  color:white;
  padding:11px 15px;
  border-radius:10px;
}

.comment{
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.comment-user{
  font-weight:bold;
  font-size:14px;
}

.comment-text{
  margin-top:3px;
  font-size:14px;
}

.comment-actions{
  margin-top:5px;
  display:flex;
  gap:8px;
}

.comment-actions button{
  background:none;
  color:#555;
  font-size:12px;
}

.navbar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:2000;
}

.nav-btn{
  background:none;
  color:#555;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:12px;
  gap:3px;
}

.nav-btn span{
  font-size:22px;
}

.search-box{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.search-box input{
  flex:1;
  padding:12px;
  border:1px solid #ddd;
  border-radius:11px;
}

.section-title{
  font-size:19px;
  font-weight:bold;
  margin-bottom:12px;
}

.profile-cover{
  text-align:center;
}

.big-avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
}

.profile-stats{
  display:flex;
  justify-content:center;
  gap:30px;
  margin:15px 0;
}

.stat{
  text-align:center;
}

.stat b{
  display:block;
  font-size:18px;
}

.profile-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
}

.profile-buttons button{
  background:#f1f5f9;
  padding:10px 12px;
  border-radius:10px;
}

.upload-box{
  background:white;
  border-radius:16px;
  padding:18px;
}

.type-buttons{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.type-btn{
  flex:1;
  padding:12px;
  border-radius:10px;
  background:#e5e7eb;
}

.type-btn.active{
  background:#111827;
  color:white;
}

input[type=file]{
  width:100%;
  margin:12px 0;
}

textarea{
  width:100%;
  min-height:80px;
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:5000;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:white;
  width:100%;
  max-width:450px;
  max-height:85vh;
  overflow:auto;
  border-radius:18px;
  padding:18px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close-btn{
  background:#eee;
  width:35px;
  height:35px;
  border-radius:50%;
}

.setting-item{
  width:100%;
  background:#f5f5f5;
  padding:14px;
  border-radius:12px;
  margin-bottom:9px;
  text-align:left;
  font-size:15px;
}

.list-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.list-item .avatar{
  width:42px;
  height:42px;
}

.empty{
  text-align:center;
  padding:30px 10px;
  color:#777;
}

.story-row{
  display:flex;
  gap:12px;
  overflow-x:auto;
  margin-bottom:15px;
}

.story{
  min-width:70px;
  text-align:center;
  font-size:12px;
}

.story img{
  width:60px;
  height:60px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #111827;
}

.dark{
  background:#111827;
  color:#f9fafb;
}

.dark .topbar,
.dark .navbar,
.dark .card,
.dark .upload-box,
.dark .modal-box{
  background:#1f2937;
  color:#f9fafb;
}

.dark .action-btn,
.dark .profile-buttons button,
.dark .icon-btn,
.dark .setting-item{
  background:#374151;
  color:white;
}

.dark input,
.dark textarea{
  background:#111827;
  color:white;
  border-color:#4b5563;
}

.toast{
  position:fixed;
  bottom:85px;
  left:50%;
  transform:translateX(-50%);
  background:#111827;
  color:white;
  padding:12px 18px;
  border-radius:12px;
  z-index:9000;
  display:none;
}
</style>
</head>

<body>

<header class="topbar">
  <div class="logo">🎬 ReelHub</div>

  <div class="header-actions">
    <button class="icon-btn" onclick="openPanel('searchPanel')">🔍</button>
    <button class="icon-btn" onclick="openSettings()">⚙️</button>
  </div>
</header>

<!-- HOME -->
<section id="homePanel" class="panel active">

  <div id="storiesArea"></div>

  <div class="section-title">Long Videos</div>
  <div id="homeVideos"></div>

</section>

<!-- SHORTS -->
<section id="shortsPanel" class="panel">

  <div class="section-title">🎞️ Short Videos</div>

  <div id="shortVideos"></div>

</section>

<!-- SEARCH -->
<section id="searchPanel" class="panel">

  <div class="section-title">🔍 Search</div>

  <div class="search-box">
    <input id="searchInput" placeholder="Username या नाम खोजें">
    <button class="primary" onclick="searchUsers()">Search</button>
  </div>

  <div id="searchResults"></div>

</section>

<!-- UPLOAD -->
<section id="uploadPanel" class="panel">

  <div class="section-title">➕ Upload</div>

  <div class="upload-box">

    <div class="type-buttons">
      <button id="shortTypeBtn" class="type-btn active"
        onclick="setVideoType('short')">
        🎞️ Short Video
      </button>

      <button id="longTypeBtn" class="type-btn"
        onclick="setVideoType('long')">
        🎬 Long Video
      </button>
    </div>

    <input type="file" id="videoFile" accept="video/*">

    <textarea id="videoCaption"
      placeholder="Video के बारे में कुछ लिखें..."></textarea>

    <button class="primary"
      style="width:100%;margin-top:10px"
      onclick="uploadVideo()">
      ⬆️ Upload Video
    </button>

    <hr style="margin:20px 0">

    <h3>Add Story</h3>

    <input type="file" id="storyFile" accept="image/*,video/*">

    <button class="primary"
      style="width:100%"
      onclick="uploadStory()">
      📖 Add Story
    </button>

  </div>

</section>

<!-- ALERTS -->
<section id="alertsPanel" class="panel">

  <div class="section-title">🔔 Notifications</div>

  <div id="alertsList"></div>

</section>

<!-- PROFILE -->
<section id="profilePanel" class="panel">

  <div class="card profile-cover">

    <img id="profilePhoto"
      class="big-avatar"
      src="https://via.placeholder.com/100">

    <h2 id="profileName">User</h2>

    <p id="profileUsername">@username</p>

    <div class="profile-stats">

      <div class="stat">
        <b id="followersCount">0</b>
        Followers
      </div>

      <div class="stat">
        <b id="followingCount">0</b>
        Following
      </div>

      <div class="stat">
        <b id="videoCount">0</b>
        Videos
      </div>

    </div>

    <div class="profile-buttons">

      <button onclick="openFollowers()">
        👥 Followers
      </button>

      <button onclick="openFollowing()">
        ➡️ Following
      </button>

      <button onclick="openSavedVideos()">
        🔖 Saved Videos
      </button>

      <button onclick="openHistory()">
        📜 History
      </button>

      <button onclick="openDownloads()">
        ⬇️ Downloaded Videos
      </button>

      <button onclick="editProfile()">
        ✏️ Edit Profile
      </button>

    </div>

  </div>

  <div class="section-title">My Videos</div>

  <div id="myVideos"></div>

</section>

<!-- PUBLIC PROFILE -->
<section id="publicProfilePanel" class="panel">

  <div class="card profile-cover">

    <img id="publicPhoto"
      class="big-avatar"
      src="https://via.placeholder.com/100">

    <h2 id="publicName">User</h2>

    <p id="publicUsername">@username</p>

    <div class="profile-stats">

      <div class="stat">
        <b id="publicFollowers">0</b>
        Followers
      </div>

      <div class="stat">
        <b id="publicFollowing">0</b>
        Following
      </div>

      <div class="stat">
        <b id="publicVideos">0</b>
        Videos
      </div>

    </div>

    <button id="publicFollowBtn"
      class="follow-btn"
      onclick="togglePublicFollow()">
      Follow
    </button>

  </div>

  <div class="section-title">Videos</div>

  <div id="publicUserVideos"></div>

</section>

<!-- NAV -->
<nav class="navbar">

  <button class="nav-btn" onclick="openPanel('homePanel')">
    <span>🏠</span>Home
  </button>

  <button class="nav-btn" onclick="openPanel('shortsPanel')">
    <span>🎞️</span>Shorts
  </button>

  <button class="nav-btn" onclick="openPanel('uploadPanel')">
    <span>➕</span>Upload
  </button>

  <button class="nav-btn" onclick="openPanel('alertsPanel')">
    <span>🔔</span>Alerts
  </button>

  <button class="nav-btn" onclick="openPanel('profilePanel')">
    <span>👤</span>Profile
  </button>

</nav>

<!-- SETTINGS MODAL -->
<div id="settingsModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">
      <h2>⚙️ Settings</h2>
      <button class="close-btn"
        onclick="closeModal('settingsModal')">✕</button>
    </div>

    <button class="setting-item"
      onclick="toggleDarkMode()">
      🌙 Dark Mode
    </button>

    <button class="setting-item"
      onclick="showWallet()">
      💰 Wallet
    </button>

    <button class="setting-item"

    <button class="setting-item"

    </button>

<!-- LIST MODAL -->
<div id="listModal" class="modal">

    <div class="modal-head">

      <button class="close-btn"
        onclick="closeModal('listModal')">✕</button>
    </div>

    <div id="listContent"></div>

  </div>

</div>

<!-- EDIT PROFILE -->
<div id="editProfileModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">
      <h2>✏️ Edit Profile</h2>
      <button class="close-btn"
        onclick="closeModal('editProfileModal')">✕</button>
    </div>

    <input id="editName"
      placeholder="Name"
      style="width:100%;padding:12px;margin-bottom:10px">

    <input type="file"
      id="profilePhotoFile"
      accept="image/*">

    <button class="primary"
      style="width:100%;margin-top:10px"
      onclick="saveProfile()">
      Save Profile
    </button>

  </div>

<!-- VIDEO LIST MODAL -->
<div id="videoListModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">
      <h2 id="videoListTitle">Videos</h2>
      <button class="close-btn"
        onclick="closeModal('videoListModal')">✕</button>
    </div>

    <div id="videoListContent"></div>

  </div>

</div>

<div id="toast" class="toast"></div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  query,
  where,
  onSnapshot,
  serverTimestamp,
  increment
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* ================= FIREBASE ================= */

const firebaseConfig={
 apiKey:"AIzaSyCAiAXZjIFcbmueefZpx1SXc-_ELa57-rE",
 authDomain:"reelhu.firebaseapp.com",
 projectId:"reelhu",
 storageBucket:"reelhu.firebasestorage.app",
 messagingSenderId:"883255506643",
 appId:"1:883255506643:web:600256ed9bb47a4f828626",
 measurementId:"G-FY9N5XNF6Z"
};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


/* ================= CLOUDINARY ================= */

const CLOUDINARY_CLOUD_NAME="s3eresx6";
const CLOUDINARY_UPLOAD_PRESET="reelhub_upload";


/* ================= VARIABLES ================= */

let currentUser=null;
let currentProfile=null;

let selectedVideoType="short";

let publicProfileUid=null;

const placeholder="https://via.placeholder.com/100";


/* ================= HELPERS ================= */

window.showToast=function(message){

 const t=document.getElementById("toast");

 t.innerText=message;
 t.style.display="block";

 setTimeout(()=>{
   t.style.display="none";
 },2500);

};


window.closeModal=function(id){
 document.getElementById(id).classList.remove("show");
};


window.openPanel=function(id){

 document.querySelectorAll(".panel")
 .forEach(x=>x.classList.remove("active"));

 document.getElementById(id)
 .classList.add("active");

 window.scrollTo(0,0);

};


async function getProfile(uid){

 const snap=await getDoc(
   doc(db,"profiles",uid)
 );

 if(snap.exists()) return snap.data();

 return null;
}


/* ================= AUTH ================= */

onAuthStateChanged(auth,async user=>{

 currentUser=user;

 if(user){

   await ensureProfile();

   await loadMyProfile();

   loadVideos();

   loadStories();

 }else{

   await login();

 }

});


async function login(){

 try{

   const provider=new GoogleAuthProvider();

   await signInWithPopup(auth,provider);

 }catch(error){

   console.error(error);

   showToast("Login failed");

 }

}


async function ensureProfile(){

 const ref=doc(db,"profiles",currentUser.uid);

 const snap=await getDoc(ref);

 if(!snap.exists()){

   const username=
     (currentUser.displayName||"user")
     .toLowerCase()
     .replace(/[^a-z0-9]/g,"")
     .slice(0,18)
     +"_"+Math.floor(Math.random()*9999);

   await setDoc(ref,{

     uid:currentUser.uid,
     name:currentUser.displayName||"User",
     username,
     photo:currentUser.photoURL||placeholder,
     followersCount:0,
     followingCount:0,
     videoCount:0,
     createdAt:serverTimestamp()

   });

 }

}


/* ================= PROFILE ================= */

async function loadMyProfile(){

 currentProfile=await getProfile(currentUser.uid);

 if(!currentProfile)return;

 document.getElementById("profileName")
 .innerText=currentProfile.name||"User";

 document.getElementById("profileUsername")
 .innerText="@"+(currentProfile.username||"user");

 document.getElementById("profilePhoto")
 .src=currentProfile.photo||placeholder;

 document.getElementById("followersCount")
 .innerText=currentProfile.followersCount||0;

 document.getElementById("followingCount")
 .innerText=currentProfile.followingCount||0;

 document.getElementById("videoCount")
 .innerText=currentProfile.videoCount||0;

}


/* ================= VIDEO TYPE ================= */

window.setVideoType=function(type){

 selectedVideoType=type;

 document.getElementById("shortTypeBtn")
 .classList.toggle("active",type==="short");

 document.getElementById("longTypeBtn")
 .classList.toggle("active",type==="long");

};


/* ================= CLOUDINARY UPLOAD ================= */

async function cloudinaryUpload(file){

 const form=new FormData();

 form.append("file",file);
 form.append("upload_preset",CLOUDINARY_UPLOAD_PRESET);

 const response=await fetch(
   `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`,
   {
     method:"POST",
     body:form
   }
 );

 if(!response.ok){

   throw new Error("Cloudinary upload failed");

 }

 return await response.json();

}


/* ================= VIDEO UPLOAD ================= */

window.uploadVideo=async function(){

 if(!currentUser){

   showToast("पहले login करें");
   return;

 }

 const file=document.getElementById("videoFile").files[0];

 const caption=document.getElementById("videoCaption").value.trim();

 if(!file){

   showToast("Video select करें");
   return;

 }

 try{

   showToast("Video upload हो रही है...");

   const result=await cloudinaryUpload(file);

   const profile=await getProfile(currentUser.uid);

   await addDoc(collection(db,"videos"),{

     uid:currentUser.uid,

     userName:profile?.name||currentUser.displayName||"User",

     username:profile?.username||"user",

     userPhoto:profile?.photo||currentUser.photoURL||placeholder,

     videoURL:result.secure_url,

     publicId:result.public_id,

     caption,

     type:selectedVideoType,

     likesCount:0,

     createdAt:serverTimestamp()

   });

   await updateDoc(
     doc(db,"profiles",currentUser.uid),
     {
       videoCount:increment(1)
     }
   );

   document.getElementById("videoFile").value="";
   document.getElementById("videoCaption").value="";

   showToast("Video uploaded successfully");

 }catch(error){

   console.error(error);

   showToast("Video upload failed");

 }

};


/* ================= STORIES ================= */

window.uploadStory=async function(){

 const file=document.getElementById("storyFile").files[0];

 if(!file){

   showToast("Story file select करें");
   return;

 }

 try{

   showToast("Story upload हो रही है...");

   const result=await cloudinaryUpload(file);

   const profile=await getProfile(currentUser.uid);

   await addDoc(collection(db,"stories"),{

     uid:currentUser.uid,

     userName:profile?.name||"User",

     username:profile?.username||"user",

     userPhoto:profile?.photo||placeholder,

     mediaURL:result.secure_url,

     mediaType:file.type.startsWith("video/")
       ?"video"
       :"image",

     createdAt:serverTimestamp()

   });

   document.getElementById("storyFile").value="";

   showToast("Story added");

   loadStories();

 }catch(error){

   console.error(error);

   showToast("Story upload failed");

 }

};


/* ================= STORIES LOAD ================= */

async function loadStories(){

 const area=document.getElementById("storiesArea");

 area.innerHTML="";

 try{

   const snap=await getDocs(
     collection(db,"stories")
   );

   if(snap.empty)return;

   const row=document.createElement("div");

   row.className="story-row";

   snap.forEach(d=>{

     const s=d.data();

     const div=document.createElement("div");

     div.className="story";

     div.innerHTML=`

       <img src="${s.userPhoto||placeholder}">
       <div>${escapeHTML(s.userName||"User")}</div>

     `;

     div.onclick=()=>{

       window.open(s.mediaURL,"_blank");

     };

     row.appendChild(div);

   });

   area.appendChild(row);

 }catch(e){

   console.error(e);

 }

}


/* ================= VIDEOS ================= */

async function loadVideos(){

 try{

   const snap=await getDocs(
     collection(db,"videos")
   );

   const videos=[];

   snap.forEach(d=>{

     videos.push({
       id:d.id,
       ...d.data()
     });

   });

   videos.sort((a,b)=>{

     const aa=a.createdAt?.seconds||0;
     const bb=b.createdAt?.seconds||0;

     return bb-aa;

   });

/* ================= DOWNLOAD ================= */

async function downloadVideo(video){

 try{

   const url=video.videoURL;

   const downloadUrl=
     url.includes("/upload/")
     ?url.replace(
        "/upload/",
        "/upload/fl_attachment/"
      )
     :url;

   const a=document.createElement("a");

   a.href=downloadUrl;

   a.download=
     "ReelHub-"+video.id+".mp4";

   a.target="_blank";

   a.rel="noopener";

   document.body.appendChild(a);

   a.click();

   a.remove();

   await setDoc(
     doc(
       db,
       "profiles",
       currentUser.uid,
       "downloads",
       video.id
     ),
     {
       videoId:video.id,
       videoURL:video.videoURL,
       caption:video.caption||"",
       userName:video.userName||"",
       downloadedAt:serverTimestamp()
     }
   );

   showToast("Download started");

 }catch(e){

   console.error(e);

   showToast("Download failed");

 }

}

/* ================= ESCAPE ================= */

function escapeHTML(value){

 return String(value||"")
   .replace(/&/g,"&amp;")
   .replace(/</g,"&lt;")

   .replace(/"/g,"&quot;")
   .replace(/'/g,"&#039;");

}
