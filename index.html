<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ReelHub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

:root{
  --bg:#f5f5f7;
  --card:#fff;
  --text:#171717;
  --muted:#777;
  --border:#e5e5e5;
  --primary:#7c3aed;
  --primary2:#ec4899;
  --danger:#ef4444;
}

body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

body.dark{
  --bg:#101014;
  --card:#19191f;
  --text:#f5f5f5;
  --muted:#aaa;
  --border:#30303a;
}

button,input,textarea,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

#loginPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(135deg,#6d28d9,#ec4899);
}

.login-card{
  width:100%;
  max-width:400px;
  background:white;
  padding:35px 25px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 20px 60px #0004;
}

.logo{
  font-size:34px;
  font-weight:900;
  background:linear-gradient(90deg,#7c3aed,#ec4899);
  color:transparent;
  background-clip:text;
  -webkit-background-clip:text;
  margin-bottom:10px;
}

.login-card p{
  color:#666;
  margin-bottom:25px;
}

.google-btn{
  width:100%;
  padding:14px;
  border-radius:12px;
  background:#111;
  color:white;
  font-weight:bold;
}

/* APP */

#app{
  min-height:100vh;
  padding-bottom:75px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding:12px 15px;
}

.topbar-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand{
  font-size:24px;
  font-weight:900;
  background:linear-gradient(90deg,#7c3aed,#ec4899);
  color:transparent;
  background-clip:text;
  -webkit-background-clip:text;
}

.search-box{
  margin-top:10px;
}

.search-box input{
  width:100%;
  padding:12px 15px;
  border:1px solid var(--border);
  border-radius:25px;
  outline:none;
  background:var(--bg);
  color:var(--text);
}

.panel{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.section-title{
  font-size:21px;
  font-weight:bold;
  margin:8px 0 15px;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:65px;
  background:var(--card);
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

.nav-btn{
  background:none;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-size:11px;
}

.nav-btn span:first-child{
  font-size:21px;
}

.nav-btn.active{
  color:var(--primary);
}

/* CARD */

.video-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  margin-bottom:18px;
  overflow:hidden;
}

.video-head{
  display:flex;
  align-items:center;
  padding:12px;
  gap:10px;
}

.avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.user-info{
  flex:1;
}

.user-name{
  font-weight:bold;
}

.username{
  color:var(--muted);
  font-size:12px;
}

.small-btn{
  padding:7px 11px;
  border-radius:20px;
  background:var(--primary);
  color:white;
  font-size:12px;
}

.outline-btn{
  padding:7px 11px;
  border-radius:20px;
  background:transparent;
  border:1px solid var(--primary);
  color:var(--primary);
  font-size:12px;
}

.video-wrap{
  width:100%;
  background:#000;
}

.video-wrap video{
  width:100%;
  display:block;
  background:#000;
}

.short-video{
  aspect-ratio:9/16;
  object-fit:cover;
  max-height:75vh;
}

.long-video{
  height:auto;
  max-height:75vh;
  object-fit:contain;
}

.video-body{
  padding:12px;
}

.video-title{
  font-weight:bold;
  margin-bottom:5px;
}

.video-description{
  color:var(--muted);
  font-size:14px;
  white-space:pre-wrap;
}

.video-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  padding:10px 12px;
  border-top:1px solid var(--border);
}

.action-btn{
  background:none;
  color:var(--text);
  padding:7px 9px;
  border-radius:8px;
}

.action-btn:hover{
  background:var(--bg);
}

.delete-btn{
  color:var(--danger);
}

.edit-btn{
  color:var(--primary);
}

/* PROFILE */

.profile-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  text-align:center;
}

.profile-photo{
  width:95px;
  height:95px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--primary);
  cursor:pointer;
}

.profile-name{
  font-size:21px;
  font-weight:bold;
  margin-top:10px;
}

.profile-id{
  color:var(--muted);
  margin-top:3px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:30px;
  margin:20px 0;
}

.stat{
  cursor:pointer;
}

.stat strong{
  display:block;
  font-size:19px;
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

.profile-buttons{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
}

.primary-btn{
  padding:11px 17px;
  border-radius:12px;
  background:linear-gradient(90deg,#7c3aed,#ec4899);
  color:white;
  font-weight:bold;
}

.gray-btn{
  padding:11px 17px;
  border-radius:12px;
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--border);
}

/* SETTINGS */

.setting-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  margin-top:10px;
  overflow:hidden;
}

.setting-item{
  width:100%;
  background:none;
  color:var(--text);
  padding:16px;
  text-align:left;
  border-bottom:1px solid var(--border);
}

.setting-item:last-child{
  border-bottom:0;
}

.setting-item small{
  display:block;
  color:var(--muted);
  margin-top:4px;
}

/* UPLOAD */

.form-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--bg);
  color:var(--text);
  outline:none;
}

.form-group textarea{
  min-height:100px;
  resize:vertical;
}

.progress{
  height:8px;
  background:var(--border);
  border-radius:10px;
  overflow:hidden;
  margin:10px 0;
}

.progress-bar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#7c3aed,#ec4899);
  transition:width .2s;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:#0009;
  z-index:200;
  display:none;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:550px;
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  color:var(--text);
  border-radius:20px;
  padding:20px;
  position:relative;
}

.close{
  position:absolute;
  right:12px;
  top:10px;
  width:35px;
  height:35px;
  border-radius:50%;
  background:var(--bg);
  color:var(--text);
  font-size:22px;
}

/* PEOPLE */

.person{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}

.person-info{
  flex:1;
}

/* COMMENTS */

.comment{
  padding:10px 0;
  border-bottom:1px solid var(--border);
}

.comment-name{
  font-weight:bold;
  font-size:13px;
}

.comment-text{
  margin-top:4px;
}

.comment-actions{
  margin-top:5px;
}

.comment-actions button{
  background:none;
  color:var(--primary);
  font-size:12px;
  margin-right:8px;
}

.comment-form{
  display:flex;
  gap:7px;
  margin-top:15px;
}

.comment-form input{
  flex:1;
  padding:11px;
  border:1px solid var(--border);
  border-radius:20px;
  background:var(--bg);
  color:var(--text);
}

/* CHAT */

.chat-messages{
  max-height:400px;
  overflow:auto;
  padding:10px 0;
}

.message{
  max-width:80%;
  padding:9px 12px;
  border-radius:15px;
  margin:7px 0;
  background:var(--bg);
}

.message.mine{
  margin-left:auto;
  background:#7c3aed;
  color:white;
}

.message small{
  display:block;
  opacity:.7;
  font-size:10px;
  margin-top:3px;
}

.chat-form{
  display:flex;
  gap:7px;
}

.chat-form input{
  flex:1;
  padding:11px;
  border:1px solid var(--border);
  border-radius:20px;
  background:var(--bg);
  color:var(--text);
}

/* SEARCH */

.search-result{
  background:var(--card);
  border:1px solid var(--border);
  padding:12px;
  border-radius:15px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

.search-result:hover{
  background:var(--bg);
}

/* EMPTY */

.empty{
  text-align:center;
  padding:40px 20px;
  color:var(--muted);
}

/* TOAST */

.toast{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  color:#fff;
  padding:12px 20px;
  border-radius:25px;
  z-index:999;
  font-size:14px;
  opacity:0;
  transition:opacity .3s;
  pointer-events:none;
}

.toast.show{
  opacity:1;
}

/* RESPONSIVE */

@media(max-width:500px){
  .panel{
    padding:10px;
  }

  .stats{
    gap:20px;
  }

  .modal-box{
    padding:16px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="login-card">
    <div class="logo">ReelHub 🎬</div>
    <p>Watch, upload and share videos</p>
    <button class="google-btn" id="googleLogin">
      Continue with Google
    </button>
    <p id="loginStatus" style="margin-top:15px"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">ReelHub</div>
      <button class="gray-btn" id="headerProfileBtn">👤</button>
    </div>

    <div class="search-box">
      <input
        id="topSearch"
        type="search"
        placeholder="Search users..."
      >
    </div>
  </header>

  <section id="homePanel" class="panel">
    <div class="section-title">Home</div>
    <div id="feed"></div>
  </section>

  <section id="shortsPanel" class="panel hidden">
    <div class="section-title">Shorts</div>
    <div id="shortsFeed"></div>
  </section>

  <section id="searchPanel" class="panel hidden">
    <div class="section-title">Search</div>
    <div id="searchResults"></div>
  </section>

  <section id="uploadPanel" class="panel hidden">
    <div class="section-title">Upload Video</div>

    <div class="form-card">

      <div class="form-group">
        <label>Video</label>
        <input id="videoFile" type="file" accept="video/*">
      </div>

      <div class="form-group">
        <label>Title</label>
        <input id="videoTitle" maxlength="100"
               placeholder="Video title">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="videoDescription"
                  placeholder="Write video description..."></textarea>
      </div>

      <div class="form-group">
        <label>Visibility</label>
        <select id="videoVisibility">
          <option value="public">Public</option>
          <option value="private">Private</option>
        </select>
      </div>

      <div class="form-group">
        <label>Video Type</label>
        <select id="videoType">
          <option value="long">Long Video</option>
          <option value="short">Shorts 9:16</option>
        </select>
      </div>

      <div class="progress">
        <div id="uploadProgress" class="progress-bar"></div>
      </div>

      <p id="uploadStatus"
         style="font-size:13px;color:var(--muted);margin:8px 0">
      </p>

      <button class="primary-btn" id="publishBtn">
        🚀 Publish Video
      </button>

    </div>
  </section>

  <section id="alertsPanel" class="panel hidden">
    <div class="section-title">Alerts</div>
    <div id="notifications"></div>
  </section>

  <section id="profilePanel" class="panel hidden">

    <div class="profile-card">

      <img id="profilePhoto"
           class="profile-photo"
           src=""
           alt="Profile">

      <div id="profileName" class="profile-name">User</div>
      <div id="profileUsername" class="profile-id">@user</div>
      <div id="profileExtra"
           style="color:var(--muted);font-size:13px;margin-top:6px">
      </div>

      <div class="stats">

        <div class="stat" id="myFollowersBtn">
          <strong id="followersCount">0</strong>
          <span>Followers</span>
        </div>

        <div class="stat" id="myFollowingBtn">
          <strong id="followingCount">0</strong>
          <span>Following</span>
        </div>

        <div class="stat">
          <strong id="videosCount">0</strong>
          <span>Videos</span>
        </div>

      </div>

      <div class="profile-buttons">
        <button class="primary-btn" id="editProfileBtn">
          ✏️ Edit Profile
        </button>

        <button class="gray-btn" id="shareAppBtn">
          📤 Share App
        </button>

        <button class="gray-btn" id="settingsBtn">
          ⚙️ Settings
        </button>
      </div>

    </div>

    <div class="section-title" style="margin-top:20px">
      My Videos
    </div>

    <div id="myVideos"></div>

  </section>

  <nav class="bottom-nav">

    <button class="nav-btn active" data-panel="homePanel">
      <span>🏠</span>
      <span>Home</span>
    </button>

    <button class="nav-btn" data-panel="shortsPanel">
      <span>🎞️</span>
      <span>Shorts</span>
    </button>

    <button class="nav-btn" data-panel="uploadPanel">
      <span>➕</span>
      <span>Upload</span>
    </button>

    <button class="nav-btn" data-panel="alertsPanel">
      <span>🔔</span>
      <span>Alerts</span>
    </button>

    <button class="nav-btn" data-panel="profilePanel">
      <span>👤</span>
      <span>Profile</span>
    </button>

  </nav>

</div>

<!-- MODALS -->
<div id="editProfileModal" class="modal">
  <div class="modal-box">
    <button class="close" data-close="editProfileModal">×</button>
    <h2>Edit Profile</h2>

    <div style="text-align:center;margin:20px 0">
      <img id="editPhotoPreview" class="profile-photo" src="" alt="Preview">
      <div style="margin-top:10px">
        <input id="profilePhotoFile" type="file" accept="image/*">
      </div>
    </div>

    <div class="form-group">
      <label>Name</label>
      <input id="editName">
    </div>

    <div class="form-group">
      <label>User ID</label>
      <input id="editUsername" placeholder="example: harshit">
      <small style="color:var(--muted)">@ automatically added</small>
    </div>

    <div class="form-group">
      <label>Age</label>
      <input id="editAge" type="number" min="1" max="120">
    </div>

    <div class="form-group">
      <label>Gender</label>
      <select id="editGender">
        <option value="">Prefer not to say</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <button class="primary-btn" id="saveProfileBtn">💾 Save Profile</button>

    <p id="profileSaveStatus" style="margin-top:10px;color:var(--muted)"></p>
  </div>
</div>

<div id="settingsModal" class="modal">
  <div class="modal-box">
    <button class="close" data-close="settingsModal">×</button>
    <h2>Settings</h2>

    <div class="setting-card">
      <button class="setting-item">
        🔒 Privacy
        <small>Coming Soon</small>
      </button>
      <button class="setting-item">
        💰 Monetization
        <small>Coming Soon</small>
      </button>
      <button class="setting-item">
        🔔 Notifications
        <small>Coming Soon</small>
      </button>
      <button class="setting-item" id="historyBtn">
        🕘 History
        <small>Watch history</small>
      </button>
      <button class="setting-item">
        📂 Playlist
        <small>Coming Soon</small>
      </button>
      <button class="setting-item">
        ⚙️ Other Settings
        <small>Coming Soon</small>
      </button>
      <button class="setting-item" id="darkModeBtn">
        🌙 Dark Mode
        <small>Change appearance</small>
      </button>
      <button class="setting-item" id="logoutBtn" style="color:#ef4444">
        🚪 Logout
      </button>
    </div>
  </div>
</div>

<div id="publicProfileModal" class="modal">
  <div class="modal-box">
    <button class="close" data-close="publicProfileModal">×</button>

    <div style="text-align:center">
      <img id="publicPhoto" class="profile-photo" src="" alt="Profile">
      <div id="publicName" class="profile-name"></div>
      <div id="publicUsername" class="profile-id"></div>
      <div id="publicExtra" style="color:var(--muted);margin-top:6px"></div>

      <div class="stats">
        <div class="stat" id="publicFollowersBtn">
          <strong id="publicFollowers">0</strong>
          <span>Followers</span>
        </div>
        <div class="stat" id="publicFollowingBtn">
          <strong id="publicFollowing">0</strong>
          <span>Following</span>
        </div>
        <div class="stat">
          <strong id="publicVideos">0</strong>
          <span>Videos</span>
        </div>
      </div>

      <div class="profile-buttons">
        <button id="publicFollowBtn" class="primary-btn">Follow</button>
        <button id="publicMessageBtn" class="gray-btn">💬 Message</button>
      </div>
    </div>

    <div class="section-title">Videos</div>
    <div id="publicVideosList"></div>
  </div>
</div>

<div id="peopleModal" class="modal">
  <div class="modal-box">
    <button class="close" data-close="peopleModal">×</button>
    <h2 id="peopleTitle">People</h2>
    <div id="peopleList"></div>
  </div>
</div>

<div id="commentsModal" class="modal">
  <div class="modal-box">
    <button class="close" data-close="commentsModal">×</button>
    <h2>Comments</h2>
    <div id="commentsList"></div>

    <div class="comment-form">
      <input id="commentInput" placeholder="Enter comment...">
      <button class="primary-btn" id="sendCommentBtn">Send</button>
    </div>
  </div>
</div>

<div id="photoViewerModal" class="modal">
  <div class="modal-box" style="text-align:center">
    <button class="close" data-close="photoViewerModal">×</button>
    <img id="largeProfilePhoto" src=""
         style="width:100%;max-height:70vh;object-fit:contain;border-radius:15px">
  </div>
</div>

<div id="editVideoModal" class="modal">
  <div class="modal-box">
    <button class="close" data-close="editVideoModal">×</button>
    <h2>Edit Video</h2>

    <input type="hidden" id="editVideoId">

    <div class="form-group">
      <label>Title</label>
      <input id="editVideoTitle">
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea id="editVideoDescription"></textarea>
    </div>

    <div class="form-group">
      <label>Visibility</label>
      <select id="editVideoVisibility">
        <option value="public">Public</option>
        <option value="private">Private</option>
      </select>
    </div>

    <div class="form-group">
      <label>Video Type</label>
      <select id="editVideoType">
        <option value="long">Long Video</option>
        <option value="short">Shorts 9:16</option>
      </select>
    </div>

    <button class="primary-btn" id="saveVideoEditBtn">💾 Save Changes</button>
  </div>
</div>

<div id="chatModal" class="modal">
  <div class="modal-box">
    <button class="close" data-close="chatModal">×</button>
    <h2 id="chatTitle">Message</h2>
    <div id="chatMessages" class="chat-messages"></div>

    <div class="chat-form">
      <input id="chatInput" placeholder="Write a message...">
      <button class="primary-btn" id="sendMessageBtn">Send</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showModal(id){
  $(id)?.classList.add("show");
}

function hideModal(id){
  $(id)?.classList.remove("show");
}

function timeValue(v){
  if(!v) return 0;
  if(typeof v.toMillis === "function"){
    return v.toMillis();
  }
  return new Date(v).getTime() || 0;
}

function avatar(url,name){
  return url ||
    "https://ui-avatars.com/api/?name="+
    encodeURIComponent(name || "User")+
    "&background=7c3aed&color=fff";
}

function toast(message){
  const el = $("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{
    el.classList.remove("show");
  }, 2500);
}

/* ==============================
   CLOUDINARY UPLOAD
============================== */

function uploadToCloudinary(file,onProgress){
  return new Promise((resolve,reject)=>{

    const resource = file.type.startsWith("video/") ? "video" : "image";

    const url =
      `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resource}/upload`;

    const xhr = new XMLHttpRequest();
    xhr.open("POST",url);

    xhr.onload = ()=>{
      if(xhr.status >= 200 && xhr.status < 300){
        try{
          const data = JSON.parse(xhr.responseText);
          resolve(data.secure_url);
        }catch(e){
          reject(e);
        }
      }else{
        reject(new Error("Cloudinary upload failed: "+xhr.status));
      }
    };

    xhr.onerror = ()=>reject(new Error("Network error"));

    xhr.upload.onprogress = e=>{
      if(e.lengthComputable){
        onProgress?.(Math.round(e.loaded / e.total * 100));
      }
    };

    const form = new FormData();
    form.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
    form.append("file",file);

    xhr.send(form);
  });
}

function startRealtimeVideos(){

  if(videosUnsubscribe){
    videosUnsubscribe();
    videosUnsubscribe = null;
  }

  videosUnsubscribe = onSnapshot(
    collection(db,"videos"),
    snapshot=>{

      videosCache = snapshot.docs.map(d=>({
        id:d.id,
        ...d.data()
      }));

      videosCache.sort(
        (a,b)=> timeValue(b.createdAt) - timeValue(a.createdAt)
      );

      renderVideoList(
        $("feed"),
        videosCache.filter(v=>
          v.visibility !== "private" ||
          v.userId === currentUser?.uid
        ),
        false
      );

      renderVideoList(
        $("shortsFeed"),
        videosCache.filter(v=>
          v.type === "short" &&
          (v.visibility !== "private" || v.userId === currentUser?.uid)
        ),
        true
      );

      loadMyVideos();

      // Refresh public profile if open
      if($("publicProfileModal")?.classList.contains("show")){
        const uid = $("publicProfileModal").dataset.uid;
        if(uid) loadPublicVideos(uid);
      }
    },
    error=>{
      console.error("Videos listener error:", error);
    }
  );
}

window.deleteVideo = async function(id){
  if(!currentUser) return;

  const ref = doc(db,"videos",id);
  const snap = await getDoc(ref);

  if(!snap.exists()){
    toast("Video नहीं मिला।");
    return;
  }

  if(snap.data().userId !== currentUser.uid){
    toast("आप इस video को delete नहीं कर सकते।");
    return;
  }

  if(!confirm("क्या आप यह video delete करना चाहते हैं?")) return;

  try{
    const comments = await getDocs(
      collection(db,"videos",id,"comments")
    );

    for(const c of comments.docs){
      await deleteDoc(c.ref);
    }

    const likes = await getDocs(
      collection(db,"videos",id,"likes")
    );

    for(const l of likes.docs){
      await deleteDoc(l.ref);
    }

    await deleteDoc(ref);
    await syncVideoCount(currentUser.uid);

    toast("🗑️ Video delete हो गया।");

  }catch(error){
    console.error(error);
    toast("Video delete error: "+error.message);
  }
};

/* ==============================

============================== */

window.likeVideo = async function(id, btnEl){
  if(!currentUser){
    toast("Login required.");
    return;
  }

  try{
    const likeRef = doc(db,"videos",id,"likes",currentUser.uid);
    const videoRef = doc(db,"videos",id);

    const [likeSnap, videoSnap] = await Promise.all([
      getDoc(likeRef),
      getDoc(videoRef)
    ]);

    if(!videoSnap.exists()) return;

    const currentLikes = Number(videoSnap.data().likes || 0);

    if(likeSnap.exists()){
      // Unlike
      await deleteDoc(likeRef);
      const newCount = Math.max(0, currentLikes - 1);
      await updateDoc(videoRef, { likes: newCount });

      if(btnEl){
        btnEl.style.color = "";
        btnEl.querySelector(".likeCount").textContent = newCount;
      }
    }else{
      // Like
      await setDoc(likeRef,{
        userId: currentUser.uid,
        createdAt: serverTimestamp()
      });

      const newCount = currentLikes + 1;
      await updateDoc(videoRef, { likes: newCount });

      if(btnEl){
        btnEl.style.color = "#ef4444";
        btnEl.querySelector(".likeCount").textContent = newCount;
      }

      // Notification to video owner
      const ownerId = videoSnap.data().userId;
      if(ownerId !== currentUser.uid){
        await addDoc(collection(db,"notifications"),{
          to: ownerId,
          from: currentUser.uid,
          title: "❤️ New Like",
          message: (currentProfile?.name || "Someone") + " liked your video",
          createdAt: serverTimestamp()
        });
      }
    }
  }catch(e){
    console.error(e);
    toast("Like error: "+e.message);
  }
};

window.toggleFollow = async function(targetUid, btnEl){

  if(!currentUser) return;
  if(targetUid === currentUser.uid) return;

  const id = currentUser.uid+"_"+targetUid;
  const ref = doc(db,"follows",id);
  const snap = await getDoc(ref);

  try{
    if(snap.exists()){
      await deleteDoc(ref);
      myFollowsCache.delete(targetUid);

      if(btnEl) btnEl.textContent = "Follow";

    }else{
      await setDoc(ref,{
        follower: currentUser.uid,
        following: targetUid,
        createdAt: serverTimestamp()
      });

      myFollowsCache.add(targetUid);

      if(btnEl) btnEl.textContent = "Following";

      // Notification
      await addDoc(collection(db,"notifications"),{
        to: targetUid,
        from: currentUser.uid,
        title: "👤 New Follower",
        message: (currentProfile?.name || "Someone") + " started following you",
        createdAt: serverTimestamp()
      });
    }

    await syncFollowCounts(currentUser.uid);
    await syncFollowCounts(targetUid);

    // Update public profile button if open
    if($("publicProfileModal").classList.contains("show")){
      const uid = $("publicProfileModal").dataset.uid;
      if(uid === targetUid){
        const followed = myFollowsCache.has(targetUid);
        $("publicFollowBtn").textContent = followed ? "Following" : "Follow";
      }
    }
  }catch(e){
    console.error(e);
    toast("Follow error: "+e.message);
  }
};


async function syncFollowCounts(uid){
  try{
    const followersQ = query(
      collection(db,"follows"),
      where("following","==",uid)
    );

    const followingQ = query(
      collection(db,"follows"),
      where("follower","==",uid)
    );

    const [followers, following] = await Promise.all([
      getDocs(followersQ),
      getDocs(followingQ)
    ]);

    await updateDoc(doc(db,"profiles",uid),{
      followers: followers.size,
      following: following.size
    });

    // Update my profile counts
    if(currentProfile && currentProfile.uid === uid){
      currentProfile.followers = followers.size;
      currentProfile.following = following.size;
      $("followersCount").textContent = followers.size;
      $("followingCount").textContent = following.size;
    }
  }catch(e){
    console.error("syncFollowCounts error", e);
  }
}

window.openPublicProfile = async function(uid){
  if(!uid) return;

  const p = await getProfile(uid);

  $("publicProfileModal").dataset.uid = uid;

  $("publicPhoto").src = avatar(p.photo, p.name);
  $("publicName").textContent = p.name || "User";
  $("publicUsername").textContent = "@"+(p.username || "user");

  let extra = [];
  if(p.age) extra.push("Age: "+p.age);
  if(p.gender) extra.push(p.gender);

  $("publicExtra").textContent = extra.join(" • ");

  $("publicFollowers").textContent = p.followers || 0;
  $("publicFollowing").textContent = p.following || 0;
  $("publicVideos").textContent = p.videos || 0;

  $("publicFollowBtn").onclick = ()=> toggleFollow(uid, $("publicFollowBtn"));
  $("publicMessageBtn").onclick = ()=> openChat(uid);

  if(currentUser && uid === currentUser.uid){
    $("publicFollowBtn").style.display = "none";
    $("publicMessageBtn").style.display = "none";
  }else{
    $("publicFollowBtn").style.display = "";
    $("publicMessageBtn").style.display = "";

    const followed = await isFollowing(uid);
    $("publicFollowBtn").textContent = followed ? "Following" : "Follow";
  }

  await loadPublicVideos(uid);

  $("publicFollowersBtn").onclick = ()=> openPeople(uid,"followers");
  $("publicFollowingBtn").onclick = ()=> openPeople(uid,"following");

  showModal("publicProfileModal");
};


async function loadPublicVideos(uid){
  const list = videosCache.filter(v=>
    v.userId === uid &&

  renderVideoList($("publicVideosList"), list, false);

/* ==============================
   PEOPLE (FOLLOWERS/FOLLOWING)
============================== */

async function openPeople(uid,type){

  if(!uid) return;

  $("peopleTitle").textContent =
    type === "followers" ? "Followers" : "Following";

  $("peopleList").innerHTML =
    `<div class="empty">Loading...</div>`;

  showModal("peopleModal");

  let q;

  if(type === "followers"){
    q = query(
      collection(db,"follows"),
      where("following","==",uid)
    );
  }else{
    q = query(
      collection(db,"follows"),
      where("follower","==",uid)
    );
  }

  const snap = await getDocs(q);

  if(!snap.size){
    $("peopleList").innerHTML =
      `<div class="empty">No users found.</div>`;
    return;
  }

  const people = [];

  for(const d of snap.docs){
    const data = d.data();
    const personUid = type === "followers" ? data.follower : data.following;
    people.push(await getProfile(personUid));
  }

  $("peopleList").innerHTML = people.map(p=>{

    const isFollowed = myFollowsCache.has(p.uid);
    const isMe = currentUser && p.uid === currentUser.uid;

    return `
    <div class="person">
      <img class="avatar" src="${avatar(p.photo,p.name)}">

      <div
        class="person-info"
        onclick='openPublicProfile(${JSON.stringify(p.uid)})'
        style="cursor:pointer"
      >
        <strong>${esc(p.name)}</strong>
        <div class="username">@${esc(p.username)}</div>
      </div>

      ${
        !isMe && currentUser
        ? `<button
             class="small-btn"
             onclick='toggleFollow(${JSON.stringify(p.uid)}, this)'>
             ${isFollowed ? "Following" : "Follow"}
           </button>`
        : ""
      }
    </div>
    `;
  }).join("");
}


/* ==============================
   SEARCH
============================== */

let searchTimeout = null;

$("topSearch").addEventListener("input", e=>{
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(()=> doSearch(e.target.value), 300);
});


async function doSearch(value){
  value = value.trim().toLowerCase();

  if(!value){
    if(!$("searchPanel").classList.contains("hidden")){
      $("searchResults").innerHTML =
        `<div class="empty">Search users by name or ID.</div>`;
    }
    return;
  }

  openPanel("searchPanel");
  $("searchResults").innerHTML =
    `<div class="empty">Searching...</div>`;

  try{
    const snap = await getDocs(collection(db,"profiles"));

    const users = snap.docs
      .map(d=>({ uid:d.id, ...d.data() }))
      .filter(p=>
        String(p.name||"").toLowerCase().includes(value) ||
        String(p.username||"").toLowerCase().includes(value.replace("@",""))
      )
      .slice(0,30);

    if(!users.length){
      $("searchResults").innerHTML =
        `<div class="empty">No user found.</div>`;
      return;
    }

    $("searchResults").innerHTML = users.map(p=>`
      <div class="search-result"
           onclick='openPublicProfile(${JSON.stringify(p.uid)})'>
        <img class="avatar" src="${avatar(p.photo,p.name)}">
        <div>
          <strong>${esc(p.name)}</strong>
          <div class="username">@${esc(p.username)}</div>
        </div>
      </div>
    `).join("");

  }catch(e){
    $("searchResults").innerHTML =
      `<div class="empty">Search error: ${esc(e.message)}</div>`;
  }
}

  if(!file) return;

$("saveProfileBtn").addEventListener("click", async()=>{

  if(!currentUser) return;

  const name = $("editName").value.trim();

  let username = $("editUsername").value
    .trim()
    .toLowerCase()
    .replace(/^@/,"")
    .replace(/[^a-z0-9_]/g,"");

  const age = $("editAge").value.trim();
  const gender = $("editGender").value;

  if(!name){
    toast("Name डालो।");
    return;
  }

  if(!username){
    toast("User ID डालो।");
    return;
  }

  try{
    $("profileSaveStatus").textContent = "Saving...";
    $("saveProfileBtn").disabled = true;

    // Username uniqueness
    const q = query(
      collection(db,"profiles"),
      where("username","==",username)
    );

    const snap = await getDocs(q);
    const duplicate = snap.docs.some(d=> d.id !== currentUser.uid);

    if(duplicate){
      $("profileSaveStatus").textContent = "This User ID is already taken.";
      $("saveProfileBtn").disabled = false;
      return;
    }

    let photo = currentProfile?.photo || "";
    const file = $("profilePhotoFile").files[0];

    if(file){
      $("profileSaveStatus").textContent = "Uploading profile photo...";
      photo = await uploadToCloudinary(file);
    }

    await updateDoc(doc(db,"profiles",currentUser.uid),{
      name,
      username,
      age,
      gender,
      photo,
      updatedAt: serverTimestamp()
    });

    currentProfile = await getProfile(currentUser.uid);
    await loadProfile();

    hideModal("editProfileModal");
    $("profileSaveStatus").textContent = "";
    toast("✅ Profile updated.");

  }catch(error){
    console.error(error);
    $("profileSaveStatus").textContent = error.message;
  }finally{
    $("saveProfileBtn").disabled = false;
  }
});

$("shareAppBtn").addEventListener("click", shareApp);

async function shareApp(){
  const url = location.href;

  const data = {
    title:"ReelHub",
    text:"Join me on ReelHub 🎬",
    url
  };

  try{
    if(navigator.share){
      await navigator.share(data);
    }else{
      await navigator.clipboard.writeText(url);
      toast("App link copied.");
    }
  }catch(e){
    console.log(e);
  }
}


window.shareVideo = async function(id){
  const url = location.origin + location.pathname +
    "?video=" + encodeURIComponent(id);

  try{
    if(navigator.share){
      await navigator.share({
        title:"ReelHub Video",
        text:"Watch this video on ReelHub 🎬",
        url
      });
    }else{
      await navigator.clipboard.writeText(url);
      toast("Video link copied.");
    }
  }catch(e){
    console.log(e);
  }
};


/* ==============================
   NOTIFICATIONS
============================== */

function startNotifications(){

  if(notificationsUnsubscribe){
    notificationsUnsubscribe();
    notificationsUnsubscribe = null;
  }

  if(!currentUser) return;

  notificationsUnsubscribe = onSnapshot(
    query(
      collection(db,"notifications"),
      where("to","==",currentUser.uid)
    ),
    snapshot=>{

      const list = snapshot.docs.map(d=>({
        id:d.id,
        ...d.data()
      }));

      list.sort((a,b)=> timeValue(b.createdAt) - timeValue(a.createdAt));

      if(!list.length){
        $("notifications").innerHTML =
          `<div class="empty">No new alerts.</div>`;
        return;
      }

      $("notifications").innerHTML = list.slice(0,50).map(n=>`
        <div class="setting-card" style="padding:15px;margin-top:8px">
          <strong>${esc(n.title || "ReelHub")}</strong>
          <p style="margin-top:5px;color:var(--muted)">
            ${esc(n.message || "")}
          </p>
        </div>
      `).join("");
    }
  );
}


/* ==============================
   CHAT
============================== */

function chatId(a,b){
  return [a,b].sort().join("_");
}


window.openChat = async function(uid){

  if(!currentUser || uid === currentUser.uid) return;

  const p = await getProfile(uid);

  currentChatUser = p;
  currentChatId = chatId(currentUser.uid, uid);

  $("chatTitle").textContent = "💬 "+p.name;

  showModal("chatModal");

  await setDoc(
    doc(db,"chats",currentChatId),
    {
      members:[currentUser.uid, uid],
      updatedAt: serverTimestamp()
    },
    { merge:true }
  );

  startChatListener();
};


function startChatListener(){

  if(chatUnsubscribe){
    chatUnsubscribe();
    chatUnsubscribe = null;
  }

  if(!currentChatId) return;

  chatUnsubscribe = onSnapshot(
    collection(db,"chats",currentChatId,"messages"),
    snapshot=>{

      const list = snapshot.docs.map(d=>({
        id:d.id,
        ...d.data()
      }));

      list.sort((a,b)=> timeValue(a.createdAt) - timeValue(b.createdAt));

      $("chatMessages").innerHTML = list.map(m=>{

        const mine = m.userId === currentUser.uid;

        return `
        <div class="message ${mine?"mine":""}">
          ${esc(m.text)}
          <small>${mine ? "You" : esc(m.userName || "User")}</small>
          ${
            mine
            ? `<div style="margin-top:4px">
                 <button
                   style="background:none;color:inherit;font-size:11px"
                   onclick='editMessage(${JSON.stringify(m.id)}, ${JSON.stringify(m.text)})'>
                   Edit
                 </button>
                 <button
                   style="background:none;color:inherit;font-size:11px"
                   onclick='deleteMessage(${JSON.stringify(m.id)})'>
                   Delete
                 </button>
               </div>`
            : ""
          }
        </div>
        `;
      }).join("");

      $("chatMessages").scrollTop = $("chatMessages").scrollHeight;
    }
  );
}


$("sendMessageBtn").addEventListener("click", sendMessage);

$("chatInput").addEventListener("keydown", e=>{
  if(e.key === "Enter") sendMessage();
});


async function sendMessage(){
  const text = $("chatInput").value.trim();
  if(!text || !currentChatId) return;

  try{
    await addDoc(
      collection(db,"chats",currentChatId,"messages"),
      {
        userId: currentUser.uid,
        userName: currentProfile?.name || "User",
        text,
        createdAt: serverTimestamp()
      }
    );

    await updateDoc(doc(db,"chats",currentChatId),{
      lastMessage: text,
      updatedAt: serverTimestamp()
    });

    $("chatInput").value = "";

  }catch(e){
    toast("Message error: "+e.message);
  }
}


window.editMessage = async function(id, oldText){

  const text = prompt("Edit message:", oldText);
  if(text === null) return;

  const clean = text.trim();
  if(!clean) return;

  const ref = doc(db,"chats",currentChatId,"messages",id);
  const snap = await getDoc(ref);

  if(!snap.exists()) return;
  if(snap.data().userId !== currentUser.uid) return;

  await updateDoc(ref,{
    text: clean,
    updatedAt: serverTimestamp()
  });
};


window.deleteMessage = async function(id){

  const ref = doc(db,"chats",currentChatId,"messages",id);
  const snap = await getDoc(ref);

  if(!snap.exists()) return;
  if(snap.data().userId !== currentUser.uid) return;

  if(!confirm("Delete message?")) return;

  await deleteDoc(ref);
};
