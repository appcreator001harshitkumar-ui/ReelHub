<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ReelHub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }

    /* LOGIN */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #111827, #4c1d95, #db2777);
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px 24px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
    }

    .logo-icon {
      width: 70px;
      height: 70px;
      margin: auto;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,#7c3aed,#ec4899);
      color: white;
      font-size: 32px;
      font-weight: bold;
    }

    .login-box h1 {
      margin-top: 15px;
      font-size: 30px;
    }

    .login-box p {
      margin-top: 7px;
      color: #777;
    }

    .google-btn {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .google-btn:hover {
      background: #f5f5f5;
    }

    /* APP */

    #app {
      display: none;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* TOP BAR */

    .topbar {
      height: 65px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 24px;
      font-weight: bold;
      background: linear-gradient(135deg,#7c3aed,#ec4899);
      -webkit-background-clip: text;
      color: transparent;
    }

    .top-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-user img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* SEARCH */

    .search-area {
      padding: 15px;
      background: white;
    }

    .search {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid #ddd;
      border-radius: 25px;
      outline: none;
      font-size: 15px;
      background: #f5f5f5;
    }

    /* WELCOME */

    .welcome {
      margin: 15px;
      padding: 20px;
      border-radius: 18px;
      color: white;
      background: linear-gradient(135deg,#7c3aed,#ec4899);
    }

    .welcome h2 {
      font-size: 22px;
    }

    .welcome p {
      margin-top: 6px;
      opacity: .9;
    }

    /* FEED */

    .feed {
      max-width: 650px;
      margin: auto;
    }

    .section-title {
      padding: 10px 15px;
      font-size: 20px;
      font-weight: bold;
    }

    /* VIDEO CARD */

    .video-card {
      background: white;
      margin: 15px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    .video-box {
      height: 360px;
      background: linear-gradient(135deg,#111827,#312e81);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 55px;
    }

    .video-info {
      padding: 15px;
    }

    .creator {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .creator img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
    }

    .creator-name {
      font-weight: bold;
    }

    .video-title {
      margin-top: 12px;
      font-size: 17px;
      font-weight: bold;
    }

    .video-description {
      margin-top: 6px;
      color: #777;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .action-btn {
      border: none;
      background: #f2f2f2;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }

    .action-btn:hover {
      background: #e5e5e5;
    }

    .liked {
      color: #e11d48;
      background: #ffe4e6;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 200;
    }

    .nav-btn {
      border: none;
      background: transparent;
      font-size: 12px;
      color: #555;
      cursor: pointer;
    }

    .nav-btn span {
      display: block;
      font-size: 22px;
      margin-bottom: 2px;
    }

    .upload-btn {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      border: none;
      background: linear-gradient(135deg,#7c3aed,#ec4899);
      color: white;
      font-size: 25px;
      cursor: pointer;
    }

    /* PROFILE PANEL */

    #profilePanel {
      display: none;
      padding: 20px;
      text-align: center;
      max-width: 500px;
      margin: auto;
    }

    .profile-card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    .profile-card img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #7c3aed;
    }

    .profile-card h2 {
      margin-top: 12px;
    }

    .profile-card p {
      margin-top: 5px;
      color: #777;
      word-break: break-word;
    }

    .logout {
      margin-top: 25px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #ef4444;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    @media (max-width: 500px) {
      .video-box {
        height: 300px;
      }
    }
  </style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage">

  <div class="login-box">

    <div class="logo-icon">▶</div>

    <h1>ReelHub</h1>

    <p>Watch • Share • Connect</p>

    <button class="google-btn" id="googleBtn">
      🔵 Continue with Google
    </button>

  </div>

</div>


<!-- ================= APP ================= -->

<div id="app">

  <!-- TOP BAR -->

  <div class="topbar">

    <div class="brand">
      ReelHub
    </div>

    <div class="top-user">

      <span id="topUserName">User</span>

      <img
        id="topUserPhoto"
        src="https://via.placeholder.com/40"
        alt="Profile"
      >

    </div>

  </div>


  <!-- SEARCH -->

  <div class="search-area">

    <input
      class="search"
      type="text"
      placeholder="🔍 Search videos..."
      id="searchInput"
    >

  </div>


  <!-- HOME -->

  <div id="homePage">

    <div class="welcome">

      <h2 id="welcomeName">
        Welcome 👋
      </h2>

      <p>
        ReelHub पर आपका स्वागत है 🎬
      </p>

    </div>


    <div class="feed">

      <div class="section-title">
        🔥 Latest Reels
      </div>


      <!-- VIDEO 1 -->

      <div class="video-card">

        <div class="video-box">
          ▶️
        </div>

        <div class="video-info">

          <div class="creator">

            <img
              id="creatorPhoto1"
              src="https://via.placeholder.com/42"
              alt="Creator"
            >

            <div>

              <div class="creator-name">
                ReelHub Creator
              </div>

              <small>
                Just now
              </small>

            </div>

          </div>

          <div class="video-title">
            Welcome to ReelHub 🎬
          </div>

          <div class="video-description">
            यह ReelHub की पहली video है।
          </div>

          <div class="actions">

            <button
              class="action-btn likeBtn"
            >
              ❤️ Like <span>0</span>
            </button>

            <button
              class="action-btn commentBtn"
            >
              💬 Comment
            </button>

            <button
              class="action-btn"
              onclick="shareVideo()"
            >
              📤 Share
            </button>

          </div>

        </div>

      </div>


      <!-- VIDEO 2 -->

      <div class="video-card">

        <div class="video-box">
          🎬
        </div>

        <div class="video-info">

          <div class="creator">

            <img
              src="https://via.placeholder.com/42"
              alt="Creator"
            >

            <div>

              <div class="creator-name">
                ReelHub
              </div>

              <small>
                Today
              </small>

            </div>

          </div>

          <div class="video-title">
            Create & Share 🚀
          </div>

          <div class="video-description">
            अपनी videos ReelHub पर share करें।
          </div>

          <div class="actions">

            <button
              class="action-btn likeBtn"
            >
              ❤️ Like <span>0</span>
            </button>

            <button
              class="action-btn commentBtn"
            >
              💬 Comment
            </button>

            <button
              class="action-btn"
              onclick="shareVideo()"
            >
              📤 Share
            </button>

          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- PROFILE -->

  <div id="profilePanel">

    <div class="profile-card">

      <img
        id="profilePhoto"
        src="https://via.placeholder.com/100"
        alt="Profile"
      >

      <h2 id="profileName">
        User
      </h2>

      <p id="profileEmail">
      </p>

      <button
        class="logout"
        id="logoutBtn"
      >
        🚪 Logout
      </button>

    </div>

  </div>


  <!-- BOTTOM NAV -->

  <div class="bottom-nav">

    <button
      class="nav-btn"
      id="homeBtn"
    >
      <span>🏠</span>
      Home
    </button>


    <button
      class="nav-btn"
      onclick="alert('Search feature जल्द आएगा 🔍')"
    >
      <span>🔍</span>
      Search
    </button>


    <button
      class="upload-btn"
      onclick="alert('Video Upload feature अगले step में आएगा 🎥')"
    >
      +
    </button>


    <button
      class="nav-btn"
      onclick="alert('Notifications feature जल्द आएगा 🔔')"
    >
      <span>🔔</span>
      Alerts
    </button>


    <button
      class="nav-btn"
      id="profileBtn"
    >
      <span>👤</span>
      Profile
    </button>

  </div>

</div>


<!-- ================= FIREBASE ================= -->

<script type="module">

  import { initializeApp } from
  "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
  } from
  "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


  /* FIREBASE CONFIG */

  const firebaseConfig = {

    apiKey:
      "AIzaSyCAiAXZjIFcbmueefZpx1SXc-_ELa57-rE",

    authDomain:
      "reelhu.firebaseapp.com",

    projectId:
      "reelhu",

    storageBucket:
      "reelhu.firebasestorage.app",

    messagingSenderId:
      "883255506643",

    appId:
      "1:883255506643:web:600256ed9bb47a4f828626",

    measurementId:
      "G-FY9N5XNF6Z"
  };


  /* INITIALIZE */

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const provider = new GoogleAuthProvider();


  /* ELEMENTS */

  const loginPage =
    document.getElementById("loginPage");

  const appPage =
    document.getElementById("app");

  const googleBtn =
    document.getElementById("googleBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const topUserName =
    document.getElementById("topUserName");

  const topUserPhoto =
    document.getElementById("topUserPhoto");

  const welcomeName =
    document.getElementById("welcomeName");

  const profilePhoto =
    document.getElementById("profilePhoto");

  const profileName =
    document.getElementById("profileName");

  const profileEmail =
    document.getElementById("profileEmail");

  const creatorPhoto1 =
    document.getElementById("creatorPhoto1");

  const homePage =
    document.getElementById("homePage");

  const profilePanel =
    document.getElementById("profilePanel");

  const homeBtn =
    document.getElementById("homeBtn");

  const profileBtn =
    document.getElementById("profileBtn");


  /* GOOGLE LOGIN */

  googleBtn.addEventListener("click", async () => {

    try {

      await signInWithPopup(
        auth,
        provider
      );

    } catch (error) {

      console.log(error);

      alert(
        "Google Login नहीं हो पाया।\n\n" +
        error.message
      );

    }

  });


  /* AUTH STATE */

  onAuthStateChanged(
    auth,
    (user) => {

      if (user) {

        /* SHOW APP */

        loginPage.style.display =
          "none";

        appPage.style.display =
          "block";


        /* USER NAME */

        const name =
          user.displayName ||
          "ReelHub User";


        /* USER PHOTO */

        const photo =
          user.photoURL ||
          "https://via.placeholder.com/100";


        /* TOP */

        topUserName.textContent =
          name;

        topUserPhoto.src =
          photo;


        /* WELCOME */

        welcomeName.textContent =
          "Welcome " + name + " 👋";


        /* PROFILE */

        profileName.textContent =
          name;

        profileEmail.textContent =
          user.email || "";

        profilePhoto.src =
          photo;


        /* CREATOR */

        creatorPhoto1.src =
          photo;

      } else {

        loginPage.style.display =
          "flex";

        appPage.style.display =
          "none";

      }

    }
  );


  /* LOGOUT */

  logoutBtn.addEventListener(
    "click",
    async () => {

      try {

        await signOut(auth);

      } catch (error) {

        alert(
          "Logout नहीं हो पाया।"
        );

      }

    }
  );


  /* HOME BUTTON */

  homeBtn.addEventListener(
    "click",
    () => {

      homePage.style.display =
        "block";

      profilePanel.style.display =
        "none";

    }
  );


  /* PROFILE BUTTON */

  profileBtn.addEventListener(
    "click",
    () => {

      homePage.style.display =
        "none";

      profilePanel.style.display =
        "block";

    }
  );


  /* LIKE BUTTONS */

  document
    .querySelectorAll(".likeBtn")
    .forEach(
      (button) => {

        button.addEventListener(
          "click",
          () => {

            const count =
              button.querySelector("span");

            let likes =
              Number(count.textContent);

            if (
              button.classList.contains(
                "liked"
              )
            ) {

              likes--;

              button.classList.remove(
                "liked"
              );

            } else {

              likes++;

              button.classList.add(
                "liked"
              );

            }

            count.textContent =
              likes;

          }
        );

      }
    );


  /* COMMENTS */

  document
    .querySelectorAll(".commentBtn")
    .forEach(
      (button) => {

        button.addEventListener(
          "click",
          () => {

            const comment =
              prompt(
                "अपना comment लिखें:"
              );

            if (comment) {

              alert(
                "Comment added: " +
                comment
              );

            }

          }
        );

      }
    );

</script>


<!-- SHARE FUNCTION -->

<script>

  function shareVideo() {

    if (
      navigator.share
    ) {

      navigator.share({

        title: "ReelHub",

        text:
          "इस video को ReelHub पर देखें 🎬",

        url:
          window.location.href

      });

    } else {

      alert(
        "Share option आपके device में available नहीं है।"
      );

    }

  }

</script>

</body>
      </html>
